<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#76d7ff" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Letter Zoo" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="description" content="A touchscreen letter writing and animal reveal game for young kids." />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icons/icon.svg" />
  <title>Magic Letter Zoo</title>
  <style>
    :root {
      --sky: #76d7ff;
      --sun: #ffd85a;
      --grass: #4bd269;
      --ink: #243b6b;
      --pink: #ff6fb1;
      --purple: #7c5cff;
      --card: rgba(255, 255, 255, 0.9);
      --shadow: 0 20px 50px rgba(36, 59, 107, 0.22);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      overflow-x: hidden;
      font-family: "Comic Sans MS", "Trebuchet MS", system-ui, -apple-system, sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at 12% 12%, #fff8b5 0 7rem, transparent 7.1rem),
        linear-gradient(#8be3ff 0%, #d8f8ff 56%, #baf6c3 56%, #64db77 100%);
      touch-action: manipulation;
    }

    body::before,
    body::after {
      content: "";
      position: fixed;
      z-index: -1;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.72);
      filter: blur(0.3px);
    }

    body::before {
      width: 14rem;
      height: 4.5rem;
      left: 12%;
      top: 12%;
      box-shadow: 12rem 5rem 0 -0.6rem rgba(255,255,255,0.6), 36rem 2rem 0 0.4rem rgba(255,255,255,0.55);
    }

    body::after {
      width: 10rem;
      height: 3.5rem;
      right: 8%;
      top: 22%;
      box-shadow: -18rem -8rem 0 0.2rem rgba(255,255,255,0.48);
    }

    .app {
      width: min(1480px, 100%);
      margin: 0 auto;
      padding: clamp(0.8rem, 1.6vw, 1.4rem);
    }

    header {
      text-align: center;
      margin-bottom: 0.7rem;
    }

    h1 {
      margin: 0;
      font-size: clamp(2.1rem, 7vw, 5.4rem);
      letter-spacing: 0.02em;
      color: #fff;
      text-shadow:
        0 5px 0 #2faee5,
        0 9px 0 #228cc3,
        0 14px 22px rgba(0, 0, 0, 0.18);
    }

    .subtitle {
      display: inline-flex;
      align-items: center;
      gap: 0.45rem;
      margin: 0.5rem 0 0;
      padding: 0.45rem 0.9rem;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.68);
      font-weight: 900;
      font-size: clamp(1rem, 2.5vw, 1.4rem);
      box-shadow: 0 9px 26px rgba(36, 59, 107, 0.12);
    }

    .game {
      display: grid;
      grid-template-columns: minmax(520px, 1.35fr) minmax(360px, 0.85fr);
      gap: clamp(0.8rem, 1.8vw, 1.4rem);
      align-items: stretch;
    }

    .panel {
      border: 7px solid rgba(255, 255, 255, 0.95);
      border-radius: 34px;
      background: var(--card);
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .draw-panel {
      display: flex;
      flex-direction: column;
      min-height: 560px;
    }

    .prompt {
      display: grid;
      grid-template-columns: auto 1fr auto;
      gap: 0.7rem;
      align-items: center;
      padding: 0.8rem 1rem;
      background: linear-gradient(90deg, #ffec7a, #ffd1ee);
      border-bottom: 6px solid rgba(255,255,255,0.72);
    }

    .star {
      display: grid;
      place-items: center;
      width: 3.7rem;
      height: 3.7rem;
      font-size: 2rem;
      border-radius: 50%;
      background: #fff;
      box-shadow: inset 0 -5px 0 rgba(0,0,0,0.08);
      animation: wiggle 1.8s ease-in-out infinite;
    }

    .prompt-text {
      min-width: 0;
    }

    .prompt-text strong {
      display: block;
      font-size: clamp(1.15rem, 3vw, 1.85rem);
      line-height: 1.05;
    }

    .prompt-text span {
      display: block;
      margin-top: 0.15rem;
      font-size: 1rem;
      font-weight: 800;
      opacity: 0.8;
    }

    .big-target {
      display: grid;
      place-items: center;
      width: clamp(4.2rem, 12vw, 6.4rem);
      height: clamp(4.2rem, 12vw, 6.4rem);
      border-radius: 28px;
      color: #fff;
      background: linear-gradient(135deg, var(--purple), var(--pink));
      font-size: clamp(2.8rem, 8vw, 4.9rem);
      font-weight: 1000;
      line-height: 1;
      text-shadow: 0 4px 0 rgba(0,0,0,0.16);
      box-shadow: 0 12px 0 #cf4b8c, 0 17px 28px rgba(0,0,0,0.18);
      transform: rotate(2deg);
    }

    .canvas-wrap {
      position: relative;
      flex: 1;
      min-height: 370px;
      background:
        linear-gradient(90deg, rgba(93, 121, 255, 0.12) 1px, transparent 1px) 0 0 / 42px 42px,
        linear-gradient(rgba(93, 121, 255, 0.12) 1px, transparent 1px) 0 0 / 42px 42px,
        #fffdf8;
      cursor: crosshair;
      touch-action: none;
    }

    #drawCanvas,
    #guideCanvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      touch-action: none;
    }

    #guideCanvas {
      opacity: 1;
      pointer-events: none;
    }

    .hint {
      position: absolute;
      left: 50%;
      top: 50%;
      width: min(88%, 520px);
      transform: translate(-50%, -50%);
      text-align: center;
      color: rgba(36, 59, 107, 0.38);
      font-size: clamp(1.2rem, 4vw, 2.2rem);
      font-weight: 1000;
      pointer-events: none;
      transition: opacity 0.18s ease;
    }

    .hint.hidden {
      opacity: 0;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 0.6rem;
      padding: 0.85rem;
      background: linear-gradient(90deg, #e4fbff, #fff1fa);
      border-top: 6px solid rgba(255,255,255,0.72);
    }

    button {
      border: 0;
      border-radius: 999px;
      padding: 1.05rem 1.35rem;
      min-height: 4.1rem;
      color: #fff;
      background: linear-gradient(180deg, #7c5cff, #5135dc);
      font-family: inherit;
      font-size: clamp(1.12rem, 1.8vw, 1.45rem);
      font-weight: 1000;
      box-shadow: 0 8px 0 #34249e, 0 12px 24px rgba(52, 36, 158, 0.22);
      cursor: pointer;
      transform: translateY(0);
      transition: transform 0.08s ease, box-shadow 0.08s ease, filter 0.14s ease;
    }

    button:active {
      transform: translateY(6px);
      box-shadow: 0 2px 0 #34249e, 0 4px 12px rgba(52, 36, 158, 0.18);
    }

    button.secondary {
      color: var(--ink);
      background: linear-gradient(180deg, #fff, #eafaff);
      box-shadow: 0 8px 0 #a6d9e8, 0 12px 20px rgba(20, 120, 160, 0.12);
    }

    button.secondary:active {
      box-shadow: 0 2px 0 #a6d9e8, 0 4px 12px rgba(20, 120, 160, 0.12);
    }

    button.sound {
      margin-left: auto;
      background: linear-gradient(180deg, #ff9f43, #ff6b35);
      box-shadow: 0 8px 0 #be4320, 0 12px 20px rgba(190, 67, 32, 0.18);
    }

    button.install {
      display: none;
      background: linear-gradient(180deg, #00cec9, #00a8a8);
      box-shadow: 0 8px 0 #007979, 0 12px 20px rgba(0, 121, 121, 0.18);
    }

    button.install.show {
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .zoo-panel {
      position: relative;
      display: flex;
      flex-direction: column;
      min-height: 560px;
      background:
        radial-gradient(circle at 18% 12%, rgba(255,255,255,0.85) 0 4rem, transparent 4.1rem),
        linear-gradient(160deg, #fffdf6, #f0f9ff 50%, #eafced);
    }

    .score-row {
      display: flex;
      justify-content: space-between;
      gap: 0.7rem;
      padding: 0.95rem 1rem 0;
    }

    .pill {
      flex: 1;
      padding: 0.55rem 0.65rem;
      border-radius: 999px;
      background: #fff;
      box-shadow: inset 0 -4px 0 rgba(0,0,0,0.06), 0 7px 18px rgba(36, 59, 107, 0.1);
      font-weight: 1000;
      text-align: center;
      white-space: nowrap;
    }

    .animal-stage {
      display: grid;
      place-items: center;
      flex: 1;
      padding: 1rem;
      text-align: center;
    }

    .animal-card {
      width: min(100%, 560px);
      min-height: 430px;
      padding: 0.35rem;
      border-radius: 34px;
      background: rgba(255, 255, 255, 0.88);
      box-shadow: inset 0 -8px 0 rgba(0,0,0,0.06), 0 18px 38px rgba(36, 59, 107, 0.14);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border: 4px dashed rgba(124, 92, 255, 0.25);
      transition: transform 0.18s ease;
    }

    .animal-card.pop {
      animation: pop 0.58s cubic-bezier(.18, 1.5, .45, 1);
    }

    .animal-emoji {
      font-size: clamp(10rem, 31vw, 21rem);
      line-height: 0.88;
      filter: drop-shadow(0 14px 0 rgba(36, 59, 107, 0.08));
      animation: floaty 2.4s ease-in-out infinite;
    }

    .recognized {
      display: none;
      margin-top: 0.5rem;
      font-size: clamp(1.6rem, 4.8vw, 3.3rem);
      font-weight: 1000;
      line-height: 1.05;
    }

    .animal-name {
      margin-top: 0.2rem;
      padding: 0.3rem 0.85rem;
      border-radius: 999px;
      color: #fff;
      background: linear-gradient(90deg, #00b894, #00cec9);
      font-size: clamp(1.35rem, 3.7vw, 2.55rem);
      font-weight: 1000;
      text-shadow: 0 3px 0 rgba(0,0,0,0.12);
    }

    .message {
      min-height: 1.8rem;
      margin-top: 0.25rem;
      font-size: clamp(0.82rem, 1.7vw, 1.05rem);
      font-weight: 1000;
      color: #4f3cc9;
      line-height: 1.05;
    }

    .alphabet {
      display: flex;
      flex-wrap: wrap;
      gap: 0.35rem;
      justify-content: center;
      padding: 0 1rem 1rem;
    }

    .letter-chip {
      width: 2.35rem;
      height: 2.35rem;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: rgba(255,255,255,0.78);
      box-shadow: inset 0 -3px 0 rgba(0,0,0,0.07);
      font-weight: 1000;
      color: rgba(36, 59, 107, 0.65);
    }

    .letter-chip.found {
      color: #fff;
      background: linear-gradient(180deg, #ff6fb1, #f6388a);
      animation: chipBounce 0.45s ease;
    }

    .letter-chip.target {
      outline: 4px solid #ffd85a;
    }

    .confetti,
    .sparkle {
      position: fixed;
      z-index: 10;
      pointer-events: none;
    }

    .confetti {
      width: 0.75rem;
      height: 1.05rem;
      border-radius: 0.2rem;
      animation: confettiFall var(--dur) ease-in forwards;
      transform: rotate(var(--rot));
    }

    .sparkle {
      font-size: 1.6rem;
      animation: sparkle 0.9s ease-out forwards;
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 1.2rem;
      z-index: 20;
      transform: translateX(-50%);
      max-width: min(92%, 620px);
      padding: 0.75rem 1rem;
      border: 4px solid #fff;
      border-radius: 999px;
      color: #fff;
      background: linear-gradient(90deg, #7c5cff, #ff6fb1);
      font-size: clamp(1rem, 3vw, 1.35rem);
      font-weight: 1000;
      box-shadow: var(--shadow);
      opacity: 0;
      transition: opacity 0.18s ease, transform 0.18s ease;
    }

    .toast.show {
      opacity: 1;
      transform: translate(-50%, -0.25rem);
    }

    @keyframes wiggle {
      0%, 100% { transform: rotate(-8deg) scale(1); }
      50% { transform: rotate(8deg) scale(1.08); }
    }

    @keyframes pop {
      0% { transform: scale(0.72) rotate(-4deg); }
      60% { transform: scale(1.08) rotate(2deg); }
      100% { transform: scale(1) rotate(0); }
    }

    @keyframes floaty {
      0%, 100% { transform: translateY(0) rotate(-2deg); }
      50% { transform: translateY(-0.45rem) rotate(2deg); }
    }

    @keyframes chipBounce {
      0% { transform: scale(0.6); }
      60% { transform: scale(1.18); }
      100% { transform: scale(1); }
    }

    @keyframes confettiFall {
      0% {
        opacity: 1;
        transform: translate3d(0, -12vh, 0) rotate(0deg);
      }
      100% {
        opacity: 0;
        transform: translate3d(var(--drift), 108vh, 0) rotate(var(--spin));
      }
    }

    @keyframes sparkle {
      0% { opacity: 0; transform: scale(0.2) rotate(0); }
      25% { opacity: 1; }
      100% { opacity: 0; transform: translate(var(--dx), var(--dy)) scale(1.6) rotate(120deg); }
    }

    @media (min-width: 900px) and (orientation: landscape) {
      html,
      body {
        height: 100vh;
        min-height: 100vh;
        overflow: hidden;
      }

      .app {
        height: 100vh;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        padding: clamp(0.35rem, 0.8vw, 0.65rem);
      }

      header {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 0.8rem;
        margin-bottom: 0.35rem;
        min-height: 0;
      }

      h1 {
        font-size: clamp(1.65rem, 3.3vw, 3.1rem);
        line-height: 0.95;
        text-shadow:
          0 3px 0 #2faee5,
          0 5px 0 #228cc3,
          0 8px 14px rgba(0, 0, 0, 0.14);
      }

      .subtitle {
        margin: 0;
        padding: 0.25rem 0.65rem;
        font-size: clamp(0.85rem, 1.35vw, 1.05rem);
        line-height: 1;
      }

      .game {
        flex: 1;
        min-height: 0;
        grid-template-columns: minmax(560px, 1.48fr) minmax(330px, 0.72fr);
        gap: clamp(0.45rem, 1vw, 0.8rem);
      }

      .panel {
        border-width: 5px;
        border-radius: 24px;
      }

      .draw-panel,
      .zoo-panel {
        min-height: 0;
        height: 100%;
      }

      .prompt {
        grid-template-columns: auto minmax(0, 1fr) auto;
        gap: 0.45rem;
        padding: 0.35rem 0.6rem;
        border-bottom-width: 4px;
      }

      .star {
        width: 2.35rem;
        height: 2.35rem;
        font-size: 1.35rem;
      }

      .prompt-text strong {
        font-size: clamp(0.95rem, 1.7vw, 1.25rem);
        line-height: 1;
      }

      .prompt-text span {
        margin-top: 0.05rem;
        font-size: clamp(0.74rem, 1.1vw, 0.9rem);
        line-height: 1;
      }

      .big-target {
        width: clamp(3rem, 5.2vw, 4.1rem);
        height: clamp(3rem, 5.2vw, 4.1rem);
        border-radius: 18px;
        font-size: clamp(2rem, 4vw, 3.2rem);
        box-shadow: 0 7px 0 #cf4b8c, 0 10px 18px rgba(0,0,0,0.16);
      }

      .canvas-wrap {
        min-height: 0;
      }

      .controls {
        gap: 0.45rem;
        padding: 0.5rem;
        border-top-width: 4px;
      }

      .controls button {
        flex: 1 1 auto;
        min-height: 3rem;
        padding: 0.65rem 0.75rem;
        font-size: clamp(0.88rem, 1.25vw, 1.05rem);
        box-shadow: 0 6px 0 #34249e, 0 9px 16px rgba(52, 36, 158, 0.18);
      }

      .controls button.secondary {
        box-shadow: 0 6px 0 #a6d9e8, 0 9px 14px rgba(20, 120, 160, 0.1);
      }

      .controls button.sound {
        margin-left: 0;
        box-shadow: 0 6px 0 #be4320, 0 9px 14px rgba(190, 67, 32, 0.14);
      }

      .score-row {
        gap: 0.45rem;
        padding: 0.45rem 0.55rem 0;
      }

      .pill {
        padding: 0.35rem 0.45rem;
        font-size: clamp(0.82rem, 1.25vw, 0.98rem);
      }

      .animal-stage {
        min-height: 0;
        padding: 0.45rem;
      }

      .animal-card {
        width: min(100%, 500px);
        min-height: 0;
        height: 100%;
        padding: 0.2rem;
        border-radius: 24px;
      }

      .animal-emoji {
        font-size: clamp(8.2rem, 19vw, 15rem);
        line-height: 0.84;
      }

      .recognized {
        margin-top: 0.25rem;
        font-size: clamp(1.15rem, 2.4vw, 2rem);
      }

      .animal-name {
        margin-top: 0.1rem;
        padding: 0.18rem 0.6rem;
        font-size: clamp(0.95rem, 1.85vw, 1.45rem);
      }

      .message {
        min-height: 1.15rem;
        margin-top: 0.15rem;
        font-size: clamp(0.62rem, 0.95vw, 0.78rem);
        line-height: 1;
      }

      .alphabet {
        gap: 0.25rem;
        padding: 0 0.55rem 0.55rem;
      }

      .letter-chip {
        width: 1.75rem;
        height: 1.75rem;
        font-size: 0.85rem;
      }
    }

    @media (max-width: 900px) {
      .game {
        grid-template-columns: 1fr;
      }

      .draw-panel,
      .zoo-panel {
        min-height: auto;
      }

      .canvas-wrap {
        min-height: 46vh;
      }

      .animal-card {
        min-height: 330px;
      }

      button.sound {
        margin-left: 0;
      }
    }

    @media (max-width: 480px) {
      .app {
        padding: 0.55rem;
      }

      .panel {
        border-width: 5px;
        border-radius: 26px;
      }

      .prompt {
        grid-template-columns: auto 1fr;
      }

      .big-target {
        grid-column: 1 / -1;
        justify-self: center;
      }

      .controls button {
        flex: 1 1 42%;
      }

      .score-row {
        flex-direction: column;
      }
    }

    /* Kid-proofing: no text selection, no long-press callouts, no pull-to-refresh. */
    html,
    body {
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
      overscroll-behavior: none;
    }

    .canvas-wrap {
      overscroll-behavior: contain;
    }
  </style>
</head>
<body>
  <main class="app">
    <header>
      <h1>Magic Letter Zoo</h1>
      <div class="subtitle">✏️ Trace a letter. Meet an animal friend! 🐾</div>
    </header>

    <section class="game" aria-label="Magic Letter Zoo game">
      <div class="panel draw-panel">
        <div class="prompt">
          <div class="star" aria-hidden="true">⭐</div>
          <div class="prompt-text">
            <strong id="promptTitle">Can you trace this letter?</strong>
            <span id="promptSubtitle">Start at the green dot. Follow the dots!</span>
          </div>
          <div class="big-target" id="targetLetter" aria-label="Target letter">A</div>
        </div>

        <div class="canvas-wrap" id="canvasWrap">
          <canvas id="guideCanvas" aria-hidden="true"></canvas>
          <canvas id="drawCanvas" aria-label="Drawing area"></canvas>
          <div class="hint" id="hint"></div>
        </div>

        <div class="controls">
          <button id="tryButton" type="button">✅ Done</button>
          <button id="clearButton" class="secondary" type="button">🧽 Wipe</button>
          <button id="newLetterButton" class="secondary" type="button">🎲 New Letter</button>
          <button id="installButton" class="install" type="button">📲 Install App</button>
          <button id="soundButton" class="sound" type="button">🔊 Sound On</button>
        </div>
      </div>

      <div class="panel zoo-panel">
        <div class="score-row">
          <div class="pill">🏆 Stars: <span id="stars">0</span></div>
          <div class="pill">🦁 Zoo friends: <span id="foundCount">0</span></div>
        </div>

        <div class="animal-stage">
          <div class="animal-card" id="animalCard">
            <div class="animal-emoji" id="animalEmoji" aria-hidden="true">🦄</div>
            <div class="recognized" id="recognized">Ready?</div>
            <div class="animal-name" id="animalName">Magic Zoo</div>
            <div class="message" id="message">Follow the dots to make the letter. An animal friend will come!</div>
          </div>
        </div>

        <div class="alphabet" id="alphabet" aria-label="Letters discovered"></div>
      </div>
    </section>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script>
    (() => {
      "use strict";

// ==ENGINE START==
// Pure (DOM-free) letter engine: guide layout, tracing check, free-draw recognizer.
const LetterEngine = (() => {
  "use strict";

  // Teaching strokes in a 0..100 box. Order + direction follow the usual
  // preschool rule: start at the top, big lines first, then the small ones.
  const TEMPLATES = {
    A: [[[50,8],[14,98]], [[50,8],[86,98]], [[28,66],[72,66]]],
    B: [[[18,8],[18,98]], [[18,8],[52,8],[68,14],[74,28],[68,44],[52,52],[18,52],[56,52],[74,60],[80,76],[72,92],[54,98],[18,98]]],
    C: [[[80,22],[66,11],[48,8],[30,13],[17,28],[11,50],[16,73],[30,90],[48,98],[66,95],[81,82]]],

// Pure (DOM-free) touch arbiter: decides which contact may draw.
//  - one finger draws, everything else is ignored
//  - two fingers landing together (pinch / two-finger tap) cancel the fresh stroke
//    and lock drawing until the fingers lift
//  - a palm / big contact, or a thumb gripping the canvas edge, never draws
//  - a hand resting on the screen does NOT block the drawing finger
//  - a stylus always wins over touch (palm rejection for pen users)
const createTouchArbiter = (opts = {}) => {
  const cfg = {
    palmPx: 64,          // contact width/height (CSS px) treated as a palm
    edgePx: 12,          // touches starting this close to the canvas edge are grip, not ink
    youngMs: 140,        // a stroke younger than this...
    youngTravelPx: 18,   // ...and shorter than this is cancelled if a 2nd finger lands
    pairMs: 350,
    pinchMs: 600,        // a 2nd finger that slides this early in a stroke = pinch, cancel
    pinchTravelPx: 30,         // two touches landing within this window = two-finger gesture
    lockMaxMs: 1500,     // safety: a lock never outlives this without new touches

  let activeId = null;
  let lockedAt = -1;
  let penDown = false;

  const isLocked = now => lockedAt >= 0 && now - lockedAt < cfg.lockMaxMs;

  function down(e) {
    // e: { id, type, x, y, w, h, cw, ch, t, button }
    const c = { type: e.type, t0: e.t, x0: e.x, y0: e.y, x: e.x, y: e.y, travel: 0, role: "idle" };
    contacts.set(e.id, c);

    if (e.type === "mouse") {
      if (e.button !== 0 || activeId !== null) { c.role = "ignored"; return { action: "ignore", reason: "mouse-busy" }; }
      c.role = "ink"; activeId = e.id; return { action: "start" };
    }

      penDown = true;
      const prev = activeId;
      c.role = "ink"; activeId = e.id; lockedAt = -1;
      if (prev !== null && prev !== e.id) {
        const p = contacts.get(prev); if (p) p.role = "ignored";
        return { action: "restart", cancelId: prev, reason: "pen-wins" };
      }
      return { action: "start" };
    }

    // ---- touch ----
    if (penDown) { c.role = "ignored"; return { action: "ignore", reason: "pen-active" }; }
    if ((e.w || 0) >= cfg.palmPx || (e.h || 0) >= cfg.palmPx) { c.role = "palm"; return { action: "ignore", reason: "palm" }; }
    if (e.x < cfg.edgePx || e.y < cfg.edgePx || e.x > e.cw - cfg.edgePx || e.y > e.ch - cfg.edgePx) {
      c.role = "grip"; return { action: "ignore", reason: "edge" };

    if (isLocked(e.t)) { c.role = "ignored"; lockedAt = e.t; return { action: "ignore", reason: "locked" }; }
    lockedAt = -1;

    if (activeId !== null) {

      if (young) {

        const cancelId = activeId;

        c.role = "ignored"; lockedAt = e.t;
        return { action: "ignore", reason: "two-finger-tap" };

    c.role = "ink"; activeId = e.id;
    return { action: "start" };
  }

  function move(e) {
    const c = contacts.get(e.id);
    if (!c) return { action: "ignore" };
    c.travel += Math.hypot(e.x - c.x, e.y - c.y);
    c.x = e.x; c.y = e.y;

        const last = stroke[stroke.length - 1];
        if (out.length && out[out.length - 1] !== last && dist(out[out.length - 1], last) > 0.5) out.push(last);
        return out;
      }

      // ---------- checking the letter ----------
      function afterStroke() {
        if (phase !== "play") return;
        const res = LetterEngine.evaluate(guide, strokes, targetLetter, { final: false, leniency });
        if (res.verdict === "pass") {
          phase = "celebrate";
          clearTimers();
          celebrateTimer = setTimeout(() => succeed(res), 260);
          return;
        }
        clearTimeout(idleTimer);
        idleTimer = setTimeout(() => finalCheck(false), IDLE_CHECK_MS);
      }

      function finalCheck(manual) {
        clearTimeout(idleTimer); idleTimer = null;
        if (phase !== "play" || drawing) return;
        let res = LetterEngine.evaluate(guide, strokes, targetLetter, { final: true, leniency });

        // Never let a 3-year-old get stuck: third "almost" with real effort counts.
        if (res.verdict === "almost" && leniency >= 2 && res.trace && res.trace.coverage >= 0.45) {
          res = { ...res, verdict: "pass" };
        }

        switch (res.verdict) {
          case "pass":
            phase = "celebrate";
            succeed(res);
            break;
          case "almost":
            leniency = Math.min(2, leniency + 1);
            glowDots = res.trace.uncovered;
            drawGuide();
            message.textContent = "Almost! Trace the pink dots ✨";
            showToast("Almost! Follow the pink dots ✨");
            say("Almost! Follow the pink dots.");
            boop(true);
            break;
          case "other":
            revealOther(res.letter);
            break;
          case "scribble":
            clearDrawing(true);
            message.textContent = "Wow, lots of lines! Let's follow the dots.";
            say(`Let's follow the dots to make ${targetLetter}.`);
            boop(true);
            animateLetter(targetLetter);
            break;
          case "retry":
            leniency = Math.min(2, leniency + 1);
            clearDrawing(true);
            message.textContent = `Watch! Then start at the green dot.`;
            say(`Watch me make ${targetLetter}. Then you try!`);
            boop(true);
            animateLetter(targetLetter);
            break;
          default: // empty
            if (manual) { showToast("Start at the green dot! 🟢"); say("Start at the green dot."); }
            else if (strokes.length) clearDrawing(true);
        }
      }

      function succeed() {
        clearTimers();
        revealAnimal(targetLetter, true);
        clearTimeout(nextTimer);
        nextTimer = setTimeout(nextTarget, 4600);
      }

      function revealOther(letter) {
        revealAnimal(letter, false);
        message.textContent = `That looks like ${letter}! Now can you trace ${targetLetter}?`;
        wipeTimer = setTimeout(() => clearDrawing(true), 5200);
      }

      function revealAnimal(letter, isTarget) {
        const animal = getAnimalForLetter(letter);
        const alreadyFound = found.has(letter);
        animalEmoji.textContent = animal.emoji;
        recognized.textContent = `I see ${letter}!`;
        animalName.textContent = `${letter} is for ${animal.name}!`;
        const praise = ["Amazing!", "Wow!", "Super writing!", "Zoo-rific!", "You did it!", "Fantastic!"][Math.floor(Math.random() * 6)];

        if (isTarget) {
          message.textContent = `${praise} ${animal.name} says "${animal.sound}"`;
          stars += alreadyFound ? 1 : 3;
          animateLetter(letter, () => {});
          promptSubtitle.textContent = "Great job! A new letter is coming...";
        } else {
          stars += alreadyFound ? 0 : 1;
        }

        found.add(letter);
        updateScore();
        markLetter();
        animalCard.classList.remove("pop");
        void animalCard.offsetWidth;
        animalCard.classList.add("pop");
        burstConfetti(isTarget ? 70 : 36);
        cheer(letter, isTarget);
        speakAnimal(letter, animal);
        showToast(isTarget ? `You did ${letter}! ⭐⭐⭐` : `${letter} is for ${animal.name}!`);
      }

      function updateScore() {
        starsEl.textContent = stars;
        foundCountEl.textContent = found.size;
      }

      function markLetter() {
        alphabetChips.forEach((chip, l) => {
          chip.classList.toggle("found", found.has(l));
          chip.classList.toggle("target", l === targetLetter);
          chip.setAttribute("aria-label", `${l}${found.has(l) ? " discovered" : " not discovered yet"}${l === targetLetter ? ", current target" : ""}`);
        });
      }

      function clearDrawing(keepMessage = false) {
        clearTimers();
        strokes = [];
        currentStroke = [];
        glowDots = null;
        ictx.clearRect(0, 0, width, height);
        if (guide) LetterEngine.resetCoverage(guide);
        hint.classList.remove("hidden");
        if (!keepMessage) message.textContent = "Start at the green dot and follow the dots!";
        if (!teaching) drawGuide();
        render();
      }

      function resetAnimalStageForTracing() {
        if ("speechSynthesis" in window) window.speechSynthesis.cancel();
        animalCard.classList.remove("pop");
        animalEmoji.textContent = "✏️";
        recognized.textContent = "";
        animalName.textContent = "Trace the letter";
        message.textContent = "Start at the green dot and follow the dots!";
      }

      function setTarget(letter) {
        targetLetter = letter;
        targetIndex = targetLetters.indexOf(letter);
        targetLetterEl.textContent = letter;
        promptTitle.textContent = `Can you trace ${letter}?`;
        promptSubtitle.textContent = "Start at the green dot. Follow the dots!";
        leniency = 0;
        glowDots = null;
        guide = LetterEngine.buildGuide(letter, width, height);
      }

      function nextTarget() {
        clearTimeout(nextTimer); nextTimer = null;
        clearTimeout(celebrateTimer); celebrateTimer = null;
        cancelTeachingAnimation();
        setTarget(targetLetters[(targetIndex + 1) % targetLetters.length]);
        resetAnimalStageForTracing();
        markLetter();
        clearDrawing(true);
        phase = "play";
        say(`Can you trace ${targetLetter}?`, 350);
      }

      // ---------- effects ----------
      function showToast(text) {
        toast.textContent = text;
        toast.classList.add("show");
        clearTimeout(showToast.timer);
        showToast.timer = setTimeout(() => toast.classList.remove("show"), 1600);
      }

      function burstConfetti(count) {
        const colors = ["#ff6fb1", "#ffd85a", "#4bd269", "#7c5cff", "#00cec9", "#ff9f43"];
        for (let i = 0; i < count; i++) {
          const piece = document.createElement("div");
          piece.className = "confetti";
          piece.style.left = `${Math.random() * 100}vw`;
          piece.style.top = `${-8 - Math.random() * 20}vh`;
          piece.style.background = colors[i % colors.length];
          piece.style.setProperty("--dur", `${1.6 + Math.random() * 1.6}s`);
          piece.style.setProperty("--drift", `${-80 + Math.random() * 160}px`);
          piece.style.setProperty("--spin", `${360 + Math.random() * 720}deg`);
          piece.style.setProperty("--rot", `${Math.random() * 180}deg`);
          document.body.appendChild(piece);
          piece.addEventListener("animationend", () => piece.remove(), { once: true });
        }
      }

      function sparkleAt(point) {
        if (!point) return;
        const icons = ["✨", "⭐", "💫", "🌟"];
        const rect = drawCanvas.getBoundingClientRect();
        for (let i = 0; i < 5; i++) {
          const sp = document.createElement("div");
          sp.className = "sparkle";
          sp.textContent = icons[Math.floor(Math.random() * icons.length)];
          sp.style.left = `${rect.left + point.x}px`;
          sp.style.top = `${rect.top + point.y}px`;
          sp.style.setProperty("--dx", `${-45 + Math.random() * 90}px`);
          sp.style.setProperty("--dy", `${-55 + Math.random() * 60}px`);
          document.body.appendChild(sp);
          sp.addEventListener("animationend", () => sp.remove(), { once: true });
        }
      }

      // ---------- audio ----------
      function ensureAudio() {
        if (!audioEnabled) return null;
        if (!audioCtx) {
          const Context = window.AudioContext || window.webkitAudioContext;
          if (!Context) return null;
          audioCtx = new Context();
        }
        if (audioCtx.state === "suspended") audioCtx.resume();
        return audioCtx;
      }

      function tone(freq, duration, type = "sine", delay = 0, gainValue = 0.06) {
        const ctx = ensureAudio();
        if (!ctx) return;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, ctx.currentTime + delay);
        gain.gain.setValueAtTime(0.0001, ctx.currentTime + delay);
        gain.gain.exponentialRampToValueAtTime(gainValue, ctx.currentTime + delay + 0.018);
        gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + delay + duration);
        osc.connect(gain).connect(ctx.destination);
        osc.start(ctx.currentTime + delay);
        osc.stop(ctx.currentTime + delay + duration + 0.02);
      }

      function cheer(letter, big) {
        if (!audioEnabled) return;
        const base = 240 + (letter.charCodeAt(0) - 65) * 9;
        tone(base, 0.14, "triangle", 0, 0.055);
        tone(base * 1.25, 0.14, "triangle", 0.13, 0.065);
        tone(base * 1.5, 0.18, "triangle", 0.26, 0.075);
        if (big) tone(base * 2, 0.22, "sine", 0.43, 0.055);
      }

      // Only happy sounds: no "wrong" buzzer for preschoolers.
      function boop() { if (audioEnabled) tone(540, 0.15, "triangle", 0, 0.04); }
      function playTinyTap() { if (audioEnabled) tone(640, 0.035, "sine", 0, 0.015); }

      // Rising "pling" as dots light up: progress you can hear.
      function pling() {
        if (!audioEnabled || !guide) return;
        const now = performance.now();
        if (now - lastPling < 70) return;
        lastPling = now;
        const frac = guide.dots.filter(d => d.covered).length / guide.dots.length;
        tone(520 + 520 * frac, 0.06, "sine", 0, 0.025);
      }

      function chooseVoice() {
        if (!("speechSynthesis" in window)) return null;
        const voices = window.speechSynthesis.getVoices();
        preferredVoice =
          voices.find(v => /^en(-|_)?/i.test(v.lang) && /female|samantha|victoria|karen|zira|google/i.test(v.name)) ||
          voices.find(v => /^en(-|_)?/i.test(v.lang)) || voices[0] || null;
        return preferredVoice;
      }

      function unlockSpeech() {
        if (speechUnlocked || !audioEnabled || !("speechSynthesis" in window)) return;
        speechUnlocked = true;
        chooseVoice();
        try {
          const warmup = new SpeechSynthesisUtterance(" ");
          warmup.volume = 0;
          if (preferredVoice) warmup.voice = preferredVoice;
          window.speechSynthesis.speak(warmup);
          window.speechSynthesis.cancel();
        } catch (error) { /* speech is optional */ }
      }

      function say(text, delay = 60) {
        if (!audioEnabled || !speechUnlocked || !("speechSynthesis" in window)) return;
        const speak = () => {
          const u = new SpeechSynthesisUtterance(text);
          u.lang = "en-US"; u.rate = 0.8; u.pitch = 1.18; u.volume = 1;
          const voice = chooseVoice();
          if (voice) u.voice = voice;
          window.speechSynthesis.cancel();
          setTimeout(() => window.speechSynthesis.speak(u), delay);
        };
        if (window.speechSynthesis.getVoices().length === 0) {
          window.speechSynthesis.onvoiceschanged = () => { window.speechSynthesis.onvoiceschanged = null; speak(); };
          setTimeout(speak, 250);
        } else speak();
      }

      function speakAnimal(letter, animal) {
        speechUnlocked = speechUnlocked || audioEnabled;
        say(`${letter} is for ${animal.name}`);
      }

      function toggleSound() {
        audioEnabled = !audioEnabled;
        soundButton.textContent = audioEnabled ? "🔊 Sound On" : "🔇 Sound Off";
        if (audioEnabled) { ensureAudio(); boop(); showToast("Sound on!"); }
        else { if ("speechSynthesis" in window) window.speechSynthesis.cancel(); showToast("Sound off"); }
      }

      // ---------- install ----------
      async function installWebApp() {
        if (!deferredInstallPrompt) { showToast("Use your browser menu to add this game to the home screen."); return; }
        deferredInstallPrompt.prompt();
        await deferredInstallPrompt.userChoice;
        deferredInstallPrompt = null;
        installButton.classList.remove("show");
      }

      function setupWebAppInstall() {
        if ("serviceWorker" in navigator) {
          window.addEventListener("load", () => { navigator.serviceWorker.register("./sw.js").catch(() => {}); });
        }
        window.addEventListener("beforeinstallprompt", event => {
          event.preventDefault();
          deferredInstallPrompt = event;
          installButton.classList.add("show");
        });
        window.addEventListener("appinstalled", () => {
          deferredInstallPrompt = null;
          installButton.classList.remove("show");
          showToast("Magic Letter Zoo installed!");
        });
      }

      // ---------- wiring ----------
      function initEvents() {
        drawCanvas.addEventListener("pointerdown", onPointerDown);
        drawCanvas.addEventListener("pointermove", onPointerMove);
        // Listen on window so a finger lifted outside the canvas is never "stuck down".
        window.addEventListener("pointerup", onPointerUp);
        window.addEventListener("pointercancel", onPointerUp);
        drawCanvas.addEventListener("lostpointercapture", e => {
          if (drawing && e.pointerId === arbiter.activeId) onPointerUp(e);
        });

        // Stop the browser from hijacking little fingers: no pinch-zoom, no
        // long-press menus, no text-selection magnifier, no pull-to-refresh.
        canvasWrap.addEventListener("touchmove", e => e.preventDefault(), { passive: false });
        canvasWrap.addEventListener("contextmenu", e => e.preventDefault());
        document.addEventListener("gesturestart", e => e.preventDefault());
        document.addEventListener("dblclick", e => e.preventDefault());

        tryButton.addEventListener("click", () => {
          ensureAudio(); unlockSpeech();
          if (phase === "play") finalCheck(true);
        });
        clearButton.addEventListener("click", () => {
          ensureAudio(); unlockSpeech();
          if (phase !== "play") return;
          cancelTeachingAnimation();
          clearDrawing();
          boop();
        });
        newLetterButton.addEventListener("click", () => {
          ensureAudio(); unlockSpeech();
          nextTarget();
          boop();
        });
        installButton.addEventListener("click", installWebApp);
        soundButton.addEventListener("click", () => { unlockSpeech(); toggleSound(); });

        if ("ResizeObserver" in window) new ResizeObserver(() => resizeCanvases()).observe(canvasWrap);
        window.addEventListener("resize", resizeCanvases);
        window.addEventListener("orientationchange", () => setTimeout(resizeCanvases, 180));
      }

      function welcome() {
        setTarget("A");
        promptSubtitle.textContent = "Start at the green dot. Follow the dots!";
        animalEmoji.textContent = "🦁";
        recognized.textContent = "Hello, little writer!";
        animalName.textContent = "Welcome to the Zoo";
        message.textContent = "Follow the dots to make the letter. An animal friend will come!";
        updateScore();
        markLetter();
      }

      setupAlphabet();
      setupWebAppInstall();
      initEvents();
      welcome();
      requestAnimationFrame(resizeCanvases);

    })();
  </script>
</body>
</html>
