<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#76d7ff" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Letter Zoo" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="description" content="A touchscreen letter writing and animal reveal game for young kids." />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icons/icon.svg" />
  <title>Magic Letter Zoo</title>
  <style>
    :root {
      --sky: #76d7ff;
      --sun: #ffd85a;
      --grass: #4bd269;
      --ink: #243b6b;
      --pink: #ff6fb1;
      --purple: #7c5cff;
      --card: rgba(255, 255, 255, 0.9);
      --shadow: 0 20px 50px rgba(36, 59, 107, 0.22);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      overflow-x: hidden;
      font-family: "Comic Sans MS", "Trebuchet MS", system-ui, -apple-system, sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at 12% 12%, #fff8b5 0 7rem, transparent 7.1rem),
        linear-gradient(#8be3ff 0%, #d8f8ff 56%, #baf6c3 56%, #64db77 100%);
      touch-action: manipulation;
    }

    body::before,
    body::after {
      content: "";
      position: fixed;
      z-index: -1;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.72);
      filter: blur(0.3px);
    }

    body::before {
      width: 14rem;
      height: 4.5rem;
      left: 12%;
      top: 12%;
      box-shadow: 12rem 5rem 0 -0.6rem rgba(255,255,255,0.6), 36rem 2rem 0 0.4rem rgba(255,255,255,0.55);
    }

    body::after {
      width: 10rem;
      height: 3.5rem;
      right: 8%;
      top: 22%;
      box-shadow: -18rem -8rem 0 0.2rem rgba(255,255,255,0.48);
    }

    .app {
      width: min(1480px, 100%);
      margin: 0 auto;
      padding: clamp(0.8rem, 1.6vw, 1.4rem);
    }

    header {
      text-align: center;
      margin-bottom: 0.7rem;
    }

    h1 {
      margin: 0;
      font-size: clamp(2.1rem, 7vw, 5.4rem);
      letter-spacing: 0.02em;
      color: #fff;
      text-shadow:
        0 5px 0 #2faee5,
        0 9px 0 #228cc3,
        0 14px 22px rgba(0, 0, 0, 0.18);
    }

    .subtitle {
      display: inline-flex;
      align-items: center;
      gap: 0.45rem;
      margin: 0.5rem 0 0;
      padding: 0.45rem 0.9rem;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.68);
      font-weight: 900;
      font-size: clamp(1rem, 2.5vw, 1.4rem);
      box-shadow: 0 9px 26px rgba(36, 59, 107, 0.12);
    }

    .game {
      display: grid;
      grid-template-columns: minmax(520px, 1.35fr) minmax(360px, 0.85fr);
      gap: clamp(0.8rem, 1.8vw, 1.4rem);
      align-items: stretch;
    }

    .panel {
      border: 7px solid rgba(255, 255, 255, 0.95);
      border-radius: 34px;
      background: var(--card);
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .draw-panel {
      display: flex;
      flex-direction: column;
      min-height: 560px;
    }

    .prompt {
      display: grid;
      grid-template-columns: auto 1fr auto;
      gap: 0.7rem;
      align-items: center;
      padding: 0.8rem 1rem;
      background: linear-gradient(90deg, #ffec7a, #ffd1ee);
      border-bottom: 6px solid rgba(255,255,255,0.72);
    }

    .star {
      display: grid;
      place-items: center;
      width: 3.7rem;
      height: 3.7rem;
      font-size: 2rem;
      border-radius: 50%;
      background: #fff;
      box-shadow: inset 0 -5px 0 rgba(0,0,0,0.08);
      animation: wiggle 1.8s ease-in-out infinite;
    }

    .prompt-text {
      min-width: 0;
    }

    .prompt-text strong {
      display: block;
      font-size: clamp(1.15rem, 3vw, 1.85rem);
      line-height: 1.05;
    }

    .prompt-text span {
      display: block;
      margin-top: 0.15rem;
      font-size: 1rem;
      font-weight: 800;
      opacity: 0.8;
    }

    .big-target {
      display: grid;
      place-items: center;
      width: clamp(4.2rem, 12vw, 6.4rem);
      height: clamp(4.2rem, 12vw, 6.4rem);
      border-radius: 28px;
      color: #fff;
      background: linear-gradient(135deg, var(--purple), var(--pink));
      font-size: clamp(2.8rem, 8vw, 4.9rem);
      font-weight: 1000;
      line-height: 1;
      text-shadow: 0 4px 0 rgba(0,0,0,0.16);
      box-shadow: 0 12px 0 #cf4b8c, 0 17px 28px rgba(0,0,0,0.18);
      transform: rotate(2deg);
    }

    .canvas-wrap {
      position: relative;
      flex: 1;
      min-height: 370px;
      background:
        linear-gradient(90deg, rgba(93, 121, 255, 0.12) 1px, transparent 1px) 0 0 / 42px 42px,
        linear-gradient(rgba(93, 121, 255, 0.12) 1px, transparent 1px) 0 0 / 42px 42px,
        #fffdf8;
      cursor: crosshair;
      touch-action: none;
    }

    #drawCanvas,
    #guideCanvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      touch-action: none;
    }

    #guideCanvas {
      opacity: 1;
      pointer-events: none;
    }

    .hint {
      position: absolute;
      left: 50%;
      top: 50%;
      width: min(88%, 520px);
      transform: translate(-50%, -50%);
      text-align: center;
      color: rgba(36, 59, 107, 0.38);
      font-size: clamp(1.2rem, 4vw, 2.2rem);
      font-weight: 1000;
      pointer-events: none;
      transition: opacity 0.18s ease;
    }

    .hint.hidden {
      opacity: 0;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 0.6rem;
      padding: 0.85rem;
      background: linear-gradient(90deg, #e4fbff, #fff1fa);
      border-top: 6px solid rgba(255,255,255,0.72);
    }

    button {
      border: 0;
      border-radius: 999px;
      padding: 1.05rem 1.35rem;
      min-height: 4.1rem;
      color: #fff;
      background: linear-gradient(180deg, #7c5cff, #5135dc);
      font-family: inherit;
      font-size: clamp(1.12rem, 1.8vw, 1.45rem);
      font-weight: 1000;
      box-shadow: 0 8px 0 #34249e, 0 12px 24px rgba(52, 36, 158, 0.22);
      cursor: pointer;
      transform: translateY(0);
      transition: transform 0.08s ease, box-shadow 0.08s ease, filter 0.14s ease;
    }

    button:active {
      transform: translateY(6px);
      box-shadow: 0 2px 0 #34249e, 0 4px 12px rgba(52, 36, 158, 0.18);
    }

    button.secondary {
      color: var(--ink);
      background: linear-gradient(180deg, #fff, #eafaff);
      box-shadow: 0 8px 0 #a6d9e8, 0 12px 20px rgba(20, 120, 160, 0.12);
    }

    button.secondary:active {
      box-shadow: 0 2px 0 #a6d9e8, 0 4px 12px rgba(20, 120, 160, 0.12);
    }

    button.sound {
      margin-left: auto;
      background: linear-gradient(180deg, #ff9f43, #ff6b35);
      box-shadow: 0 8px 0 #be4320, 0 12px 20px rgba(190, 67, 32, 0.18);
    }

    button.install {
      display: none;
      background: linear-gradient(180deg, #00cec9, #00a8a8);
      box-shadow: 0 8px 0 #007979, 0 12px 20px rgba(0, 121, 121, 0.18);
    }

    button.install.show {
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .zoo-panel {
      position: relative;
      display: flex;
      flex-direction: column;
      min-height: 560px;
      background:
        radial-gradient(circle at 18% 12%, rgba(255,255,255,0.85) 0 4rem, transparent 4.1rem),
        linear-gradient(160deg, #fffdf6, #f0f9ff 50%, #eafced);
    }

    .score-row {
      display: flex;
      justify-content: space-between;
      gap: 0.7rem;
      padding: 0.95rem 1rem 0;
    }

    .pill {
      flex: 1;
      padding: 0.55rem 0.65rem;
      border-radius: 999px;
      background: #fff;
      box-shadow: inset 0 -4px 0 rgba(0,0,0,0.06), 0 7px 18px rgba(36, 59, 107, 0.1);
      font-weight: 1000;
      text-align: center;
      white-space: nowrap;
    }

    .animal-stage {
      display: grid;
      place-items: center;
      flex: 1;
      padding: 1rem;
      text-align: center;
    }

    .animal-card {
      width: min(100%, 560px);
      min-height: 430px;
      padding: 0.35rem;
      border-radius: 34px;
      background: rgba(255, 255, 255, 0.88);
      box-shadow: inset 0 -8px 0 rgba(0,0,0,0.06), 0 18px 38px rgba(36, 59, 107, 0.14);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border: 4px dashed rgba(124, 92, 255, 0.25);
      transition: transform 0.18s ease;
    }

    .animal-card.pop {
      animation: pop 0.58s cubic-bezier(.18, 1.5, .45, 1);
    }

    .animal-emoji {
      font-size: clamp(10rem, 31vw, 21rem);
      line-height: 0.88;
      filter: drop-shadow(0 14px 0 rgba(36, 59, 107, 0.08));
      animation: floaty 2.4s ease-in-out infinite;
    }

    .recognized {
      display: none;
      margin-top: 0.5rem;
      font-size: clamp(1.6rem, 4.8vw, 3.3rem);
      font-weight: 1000;
      line-height: 1.05;
    }

    .animal-name {
      margin-top: 0.2rem;
      padding: 0.3rem 0.85rem;
      border-radius: 999px;
      color: #fff;
      background: linear-gradient(90deg, #00b894, #00cec9);
      font-size: clamp(1.35rem, 3.7vw, 2.55rem);
      font-weight: 1000;
      text-shadow: 0 3px 0 rgba(0,0,0,0.12);
    }

    .message {
      min-height: 1.8rem;
      margin-top: 0.25rem;
      font-size: clamp(0.82rem, 1.7vw, 1.05rem);
      font-weight: 1000;
      color: #4f3cc9;
      line-height: 1.05;
    }

    .alphabet {
      display: flex;
      flex-wrap: wrap;
      gap: 0.35rem;
      justify-content: center;
      padding: 0 1rem 1rem;
    }

    .letter-chip {
      width: 2.35rem;
      height: 2.35rem;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: rgba(255,255,255,0.78);
      box-shadow: inset 0 -3px 0 rgba(0,0,0,0.07);
      font-weight: 1000;
      color: rgba(36, 59, 107, 0.65);
    }

    .letter-chip.found {
      color: #fff;
      background: linear-gradient(180deg, #ff6fb1, #f6388a);
      animation: chipBounce 0.45s ease;
    }

    .letter-chip.target {
      outline: 4px solid #ffd85a;
    }

    .confetti,
    .sparkle {
      position: fixed;
      z-index: 10;
      pointer-events: none;
    }

    .confetti {
      width: 0.75rem;
      height: 1.05rem;
      border-radius: 0.2rem;
      animation: confettiFall var(--dur) ease-in forwards;
      transform: rotate(var(--rot));
    }

    .sparkle {
      font-size: 1.6rem;
      animation: sparkle 0.9s ease-out forwards;
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 1.2rem;
      z-index: 20;
      transform: translateX(-50%);
      max-width: min(92%, 620px);
      padding: 0.75rem 1rem;
      border: 4px solid #fff;
      border-radius: 999px;
      color: #fff;
      background: linear-gradient(90deg, #7c5cff, #ff6fb1);
      font-size: clamp(1rem, 3vw, 1.35rem);
      font-weight: 1000;
      box-shadow: var(--shadow);
      opacity: 0;
      transition: opacity 0.18s ease, transform 0.18s ease;
    }

    .toast.show {
      opacity: 1;
      transform: translate(-50%, -0.25rem);
    }

    @keyframes wiggle {
      0%, 100% { transform: rotate(-8deg) scale(1); }
      50% { transform: rotate(8deg) scale(1.08); }
    }

    @keyframes pop {
      0% { transform: scale(0.72) rotate(-4deg); }
      60% { transform: scale(1.08) rotate(2deg); }
      100% { transform: scale(1) rotate(0); }
    }

    @keyframes floaty {
      0%, 100% { transform: translateY(0) rotate(-2deg); }
      50% { transform: translateY(-0.45rem) rotate(2deg); }
    }

    @keyframes chipBounce {
      0% { transform: scale(0.6); }
      60% { transform: scale(1.18); }
      100% { transform: scale(1); }
    }

    @keyframes confettiFall {
      0% {
        opacity: 1;
        transform: translate3d(0, -12vh, 0) rotate(0deg);
      }
      100% {
        opacity: 0;
        transform: translate3d(var(--drift), 108vh, 0) rotate(var(--spin));
      }
    }

    @keyframes sparkle {
      0% { opacity: 0; transform: scale(0.2) rotate(0); }
      25% { opacity: 1; }
      100% { opacity: 0; transform: translate(var(--dx), var(--dy)) scale(1.6) rotate(120deg); }
    }

    @media (min-width: 900px) and (orientation: landscape) {
      html,
      body {
        height: 100vh;
        min-height: 100vh;
        overflow: hidden;
      }

      .app {
        height: 100vh;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        padding: clamp(0.35rem, 0.8vw, 0.65rem);
      }

      header {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 0.8rem;
        margin-bottom: 0.35rem;
        min-height: 0;
      }

      h1 {
        font-size: clamp(1.65rem, 3.3vw, 3.1rem);
        line-height: 0.95;
        text-shadow:
          0 3px 0 #2faee5,
          0 5px 0 #228cc3,
          0 8px 14px rgba(0, 0, 0, 0.14);
      }

      .subtitle {
        margin: 0;
        padding: 0.25rem 0.65rem;
        font-size: clamp(0.85rem, 1.35vw, 1.05rem);
        line-height: 1;
      }

      .game {
        flex: 1;
        min-height: 0;
        grid-template-columns: minmax(560px, 1.48fr) minmax(330px, 0.72fr);
        gap: clamp(0.45rem, 1vw, 0.8rem);
      }

      .panel {
        border-width: 5px;
        border-radius: 24px;
      }

      .draw-panel,
      .zoo-panel {
        min-height: 0;
        height: 100%;
      }

      .prompt {
        grid-template-columns: auto minmax(0, 1fr) auto;
        gap: 0.45rem;
        padding: 0.35rem 0.6rem;
        border-bottom-width: 4px;
      }

      .star {
        width: 2.35rem;
        height: 2.35rem;
        font-size: 1.35rem;
      }

      .prompt-text strong {
        font-size: clamp(0.95rem, 1.7vw, 1.25rem);
        line-height: 1;
      }

      .prompt-text span {
        margin-top: 0.05rem;
        font-size: clamp(0.74rem, 1.1vw, 0.9rem);
        line-height: 1;
      }

      .big-target {
        width: clamp(3rem, 5.2vw, 4.1rem);
        height: clamp(3rem, 5.2vw, 4.1rem);
        border-radius: 18px;
        font-size: clamp(2rem, 4vw, 3.2rem);
        box-shadow: 0 7px 0 #cf4b8c, 0 10px 18px rgba(0,0,0,0.16);
      }

      .canvas-wrap {
        min-height: 0;
      }

      .controls {
        gap: 0.45rem;
        padding: 0.5rem;
        border-top-width: 4px;
      }

      .controls button {
        flex: 1 1 auto;
        min-height: 3rem;
        padding: 0.65rem 0.75rem;
        font-size: clamp(0.88rem, 1.25vw, 1.05rem);
        box-shadow: 0 6px 0 #34249e, 0 9px 16px rgba(52, 36, 158, 0.18);
      }

      .controls button.secondary {
        box-shadow: 0 6px 0 #a6d9e8, 0 9px 14px rgba(20, 120, 160, 0.1);
      }

      .controls button.sound {
        margin-left: 0;
        box-shadow: 0 6px 0 #be4320, 0 9px 14px rgba(190, 67, 32, 0.14);
      }

      .score-row {
        gap: 0.45rem;
        padding: 0.45rem 0.55rem 0;
      }

      .pill {
        padding: 0.35rem 0.45rem;
        font-size: clamp(0.82rem, 1.25vw, 0.98rem);
      }

      .animal-stage {
        min-height: 0;
        padding: 0.45rem;
      }

      .animal-card {
        width: min(100%, 500px);
        min-height: 0;
        height: 100%;
        padding: 0.2rem;
        border-radius: 24px;
      }

      .animal-emoji {
        font-size: clamp(8.2rem, 19vw, 15rem);
        line-height: 0.84;
      }

      .recognized {
        margin-top: 0.25rem;
        font-size: clamp(1.15rem, 2.4vw, 2rem);
      }

      .animal-name {
        margin-top: 0.1rem;
        padding: 0.18rem 0.6rem;
        font-size: clamp(0.95rem, 1.85vw, 1.45rem);
      }

      .message {
        min-height: 1.15rem;
        margin-top: 0.15rem;
        font-size: clamp(0.62rem, 0.95vw, 0.78rem);
        line-height: 1;
      }

      .alphabet {
        gap: 0.25rem;
        padding: 0 0.55rem 0.55rem;
      }

      .letter-chip {
        width: 1.75rem;
        height: 1.75rem;
        font-size: 0.85rem;
      }
    }

    @media (max-width: 900px) {
      .game {
        grid-template-columns: 1fr;
      }

      .draw-panel,
      .zoo-panel {
        min-height: auto;
      }

      .canvas-wrap {
        min-height: 46vh;
      }

      .animal-card {
        min-height: 330px;
      }

      button.sound {
        margin-left: 0;
      }
    }

    @media (max-width: 480px) {
      .app {
        padding: 0.55rem;
      }

      .panel {
        border-width: 5px;
        border-radius: 26px;
      }

      .prompt {
        grid-template-columns: auto 1fr;
      }


      .controls button {
        flex: 1 1 42%;
      }

      .score-row {
        flex-direction: column;
      }
    }

    /* Kid-proofing: no text selection, no long-press callouts, no pull-to-refresh. */
    html,
    body {
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
      overscroll-behavior: none;
    }

    .canvas-wrap {
      overscroll-behavior: contain;
    }
    /* ---------- home screen (pick a world) ---------- */
    .home {
      position: fixed;
      inset: 0;
      z-index: 30;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: clamp(1rem, 4vh, 2.4rem);
      padding: 1.2rem;
      background:
        radial-gradient(circle at 12% 12%, #fff8b5 0 7rem, transparent 7.1rem),
        linear-gradient(#8be3ff 0%, #d8f8ff 56%, #baf6c3 56%, #64db77 100%);
    }
    .home.hidden {
      display: none;
    }
    .home-title {
      margin: 0;
      text-align: center;
      font-size: clamp(2rem, 6.5vw, 4.6rem);
      color: #fff;
      text-shadow: 0 5px 0 #2faee5, 0 9px 0 #228cc3, 0 14px 22px rgba(0, 0, 0, 0.18);
    }
    .worlds {
      display: grid;
      grid-template-columns: repeat(2, auto);
      justify-content: center;
      gap: clamp(0.8rem, 3vw, 2.2rem);
    }
    button.world-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.3rem;
      width: clamp(9rem, 40vw, 20rem);
      min-height: 0;
      padding: 0.9rem 0.8rem 1rem;
      border: 7px solid #fff;
      border-radius: 40px;
      color: var(--ink);
      background: linear-gradient(180deg, #fffef4, #fff3c4);
      box-shadow: 0 12px 0 #e2b93b, 0 20px 36px rgba(36, 59, 107, 0.2);
    }
    button.world-btn.garden {
      background: linear-gradient(180deg, #f6fff0, #d6f5c4);
      box-shadow: 0 12px 0 #5fb85a, 0 20px 36px rgba(36, 59, 107, 0.2);
    }
    button.world-btn:active {
      transform: translateY(9px);
      box-shadow: 0 3px 0 #e2b93b, 0 6px 14px rgba(36, 59, 107, 0.16);
    }
    button.world-btn.garden:active {
      box-shadow: 0 3px 0 #5fb85a, 0 6px 14px rgba(36, 59, 107, 0.16);
    }
    button.world-btn.sports {
      background: linear-gradient(180deg, #f2f9ff, #cfe6ff);
      box-shadow: 0 12px 0 #5b9be0, 0 20px 36px rgba(36, 59, 107, 0.2);
    }
    button.world-btn.sports:active {
      box-shadow: 0 3px 0 #5b9be0, 0 6px 14px rgba(36, 59, 107, 0.16);
    }
    button.world-btn.house {
      background: linear-gradient(180deg, #fff4f8, #ffd9e6);
      box-shadow: 0 12px 0 #e683a8, 0 20px 36px rgba(36, 59, 107, 0.2);
    }
    button.world-btn.house:active {
      box-shadow: 0 3px 0 #e683a8, 0 6px 14px rgba(36, 59, 107, 0.16);
    }
    @media (orientation: landscape) and (min-aspect-ratio: 13/10) {
      .worlds { grid-template-columns: repeat(4, auto); }
      button.world-btn { width: clamp(9rem, 21vw, 18rem); }
      .world-pic { height: clamp(5rem, 15vw, 11rem); font-size: clamp(4.5rem, 13vw, 9.5rem); }
      .world-name { font-size: clamp(1.5rem, 3.2vw, 2.6rem); }
    }
    button.world-btn.last {
      outline: 6px solid rgba(255, 216, 90, 0.95);
      outline-offset: 4px;

    n: [[[[28,45],[28,100],[28,62],[33,51],[43,45.5],[56,45],[67,50],[72,62],[72,100]]]],
    h: [[[[28,0],[28,100],[28,64],[33,52],[43,46],[56,45],[67,50],[72,62],[72,100]]]],
    I: [[[[50,8],[50,98]], [[28,8],[72,8]], [[28,98],[72,98]]]],
    J: [[[[66,8],[66,72],[60,88],[47,98],[31,96],[18,84]], [[40,8],[86,8]]]],

    let s = 0;
    for (let i = 1; i < pts.length; i++) s += dist(pts[i - 1], pts[i]);

  }

  function densify(pts, step) {

      const a = pts[i - 1], b = pts[i];
      const d = dist(a, b);

    });
    if (isLower(letter)) {
      // Same scale + vertical position for every lowercase letter (school lines),
      // each glyph just centred horizontally.
      const span = RULE.desc - RULE.top;
      const padY = Math.max(16, height * 0.06);
      const padX = Math.max(24, width * 0.1);
      const scale = Math.min((height - padY * 2) / span, (width - padX * 2) / LOWER_MAX_W);
      const offY = (height - span * scale) / 2 - RULE.top * scale + height * 0.02;
      const offX = width / 2 - ((minX + maxX) / 2) * scale;
      return { scale, offX, offY };
    }
    const padding = Math.max(28, Math.min(width, height) * 0.14);
    const rawW = Math.max(1, maxX - minX), rawH = Math.max(1, maxY - minY);
    const scale = Math.min((width - padding * 2) / rawW, (height - padding * 2) / rawH);
    const offX = (width - rawW * scale) / 2 - minX * scale;
    const offY = (height - rawH * scale) / 2 - minY * scale + height * 0.03;
    return { scale, offX, offY };
  }

  function layoutStrokes(letter, width, height) {
    const { scale, offX, offY } = layoutTransform(letter, width, height);
    const raw = TEMPLATES[letter] || TEMPLATES.A;
    return raw.map(s => s.map(([x, y]) => ({ x: x * scale + offX, y: y * scale + offY })));
  }

  // Canvas y of the school lines (for drawing them under lowercase letters).
  function ruledLines(width, height) {
    const { scale, offY } = layoutTransform("o", width, height);
    const y = v => v * scale + offY;
    return { top: y(RULE.top), mid: y(RULE.mid), base: y(RULE.base), desc: y(RULE.desc), scale };
  }

  function buildGuide(letter, width, height) {
    const strokes = layoutStrokes(letter, width, height);
    const ys = strokes.flat().map(p => p.y);
    const lower = isLower(letter);
    // Lowercase: size tolerances by the line height (top line to baseline), not by the
    // glyph, so a short "o" keeps the same finger-sized tolerance as a tall "h".
    const letterH = lower ? (RULE.base - RULE.top) * layoutTransform(letter, width, height).scale
                          : Math.max(...ys) - Math.min(...ys);
    // Fat-finger tolerance: ~12% of letter height (≈ a preschooler's fingertip on a tablet).
    const R = lower ? clamp(letterH * LOWER_R, 20, 50) : clamp(letterH * 0.12, 22, 58);
    const spacing = lower ? clamp(letterH / 16, 10, 26) : clamp(letterH / 15, 12, 30);
    const dots = [];
    strokes.forEach((s, si) => {
      const len = polylineLength(s);
      const count = Math.max(2, Math.round(len / spacing) + 1);
      const dense = densify(s, 1.5);
      const step = polylineLength(dense) / (count - 1);
      let acc = 0, next = 0;
      dots.push({ x: dense[0].x, y: dense[0].y, stroke: si, covered: false });
      for (let i = 1; i < dense.length && dots.filter(d => d.stroke === si).length < count; i++) {
        acc += dist(dense[i - 1], dense[i]);
        if (acc >= step * (next + 1) - 0.01) {
          next++;
          dots.push({ x: dense[i].x, y: dense[i].y, stroke: si, covered: false });
        }
      }
      const last = s[s.length - 1];
      const mine = dots.filter(d => d.stroke === si);
      if (dist(mine[mine.length - 1], last) > spacing * 0.5) dots.push({ x: last.x, y: last.y, stroke: si, covered: false });
    });
    const segments = [];
    strokes.forEach(s => { for (let i = 1; i < s.length; i++) segments.push([s[i - 1], s[i]]); });
    const guideLength = strokes.reduce((acc, s) => acc + polylineLength(s), 0);
    // Tiny strokes are "dots" (the dot on i and j): the child taps them.
    const dotStrokes = strokes.map((s, i) => (polylineLength(s) < R * 0.5 ? i : -1)).filter(i => i >= 0);
    return { letter, strokes, dots, segments, R, letterH, guideLength, spacing, dotStrokes, lower };
  }

  function resetCoverage(guide) { guide.dots.forEach(d => { d.covered = false; }); }

  // Live feedback: light up guide dots near new ink. Returns how many lit up.
  function markCoverage(guide, points) {
    let lit = 0;
    const pts = densify(points, guide.R / 3);
    for (const d of guide.dots) {
      if (d.covered) continue;
      for (const p of pts) {
        if (dist(d, p) <= guide.R) { d.covered = true; lit++; break; }
      }
    }
    return lit;
  }

  // Thresholds get kinder each time the child is told "almost".
  const LENIENCY = [
    { overall: 0.78, perStroke: 0.55, precision: 0.72, align: 0.70, maxInk: 2.4, stray: TUNE("STRAY0", 0.12) },
    { overall: 0.66, perStroke: 0.40, precision: 0.62, align: 0.64, maxInk: 2.8, stray: TUNE("STRAY1", 0.16) },
    { overall: 0.55, perStroke: 0.25, precision: 0.55, align: 0.62, maxInk: 3.0, stray: TUNE("STRAY2", 0.22) }
  ];

  function traceReport(guide, inkStrokes, leniency = 0) {
    const L = LENIENCY[clamp(leniency, 0, LENIENCY.length - 1)];
    const R = guide.R;
    const strokes = inkStrokes.filter(s => s.length > 1 || s.length === 1);
    const ink = strokes.map(s => densify(s, R / 4));
    const flat = ink.flat();
    const inkLength = inkStrokes.reduce((a, s) => a + polylineLength(s), 0);

    // Coverage: guide dots that have ink within R.
    const perStrokeTotals = guide.strokes.map(() => 0);
    const perStrokeHit = guide.strokes.map(() => 0);
    let hit = 0;
    const uncovered = [];
    for (const d of guide.dots) {
      perStrokeTotals[d.stroke]++;
      let ok = false;
      for (const p of flat) { if (dist(d, p) <= R) { ok = true; break; } }
      if (ok) { hit++; perStrokeHit[d.stroke]++; } else uncovered.push(d);
    }
    const coverage = guide.dots.length ? hit / guide.dots.length : 0;
    const perStroke = perStrokeTotals.map((t, i) => (t ? perStrokeHit[i] / t : 0));

    // Precision + alignment: is the ink ON the letter and moving ALONG it?
    let near = 0, stray = 0, alignSum = 0, alignN = 0, segCount = 0;
    ink.forEach(s => {
      for (let i = 0; i < s.length; i++) {
        let best = { d: Infinity, ux: 0, uy: 0 };
        for (const [a, b] of guide.segments) {
          const info = segInfo(s[i], a, b);
          if (info.d < best.d) best = info;
        }
        segCount++;
        if (best.d > R * 1.5) stray++;
        if (best.d <= R * 1.3) {
          near++;
          if (i > 0) {
            const dx = s[i].x - s[i - 1].x, dy = s[i].y - s[i - 1].y;
            const l = Math.hypot(dx, dy);
            if (l > 0.5) { alignSum += Math.abs((dx * best.ux + dy * best.uy) / l); alignN++; }
          }
        }
      }
    });
    const precision = segCount ? near / segCount : 0;
    // Stray ink: share of ink clearly off the letter (an extra stick, a missing-letter part).
    const strayFrac = segCount ? stray / segCount : 0;
    const align = alignN ? alignSum / alignN : 0;
    const inkRatio = guide.guideLength ? inkLength / guide.guideLength : 0;

    const pass =
      coverage >= L.overall &&
      Math.min(...perStroke) >= L.perStroke &&
      precision >= L.precision &&
      align >= L.align &&
      inkRatio <= L.maxInk &&
      strayFrac <= L.stray;

    const onGuide = precision >= 0.45 && align >= 0.55 && inkRatio <= L.maxInk + 0.6;
    const almost = !pass && onGuide && coverage >= 0.22;
    // Clearly tracing the guide (ink sits on it and follows it) but not finished yet.
    const tracingEffort = !pass && precision >= 0.85 && align >= 0.7 && coverage >= 0.35;
    let weakest = 0;
    perStroke.forEach((c, i) => { if (c < perStroke[weakest]) weakest = i; });

    return { coverage, perStroke, precision, align, inkRatio, inkLength, strayFrac, pass, onGuide, almost, tracingEffort, weakestStroke: weakest, uncovered };
  }

  // ---------- $P point-cloud recognizer (order/direction independent) ----------
  const NP = 32;

  function cloudOf(strokes) {
    const pts = [];
    strokes.forEach((s, id) => s.forEach(p => pts.push({ x: p.x, y: p.y, id })));
    if (!pts.length) return [];
    let len = 0;
    for (let i = 1; i < pts.length; i++) if (pts[i].id === pts[i - 1].id) len += dist(pts[i - 1], pts[i]);
    let out;
    if (len < 1e-6) {
      out = Array.from({ length: NP }, () => ({ ...pts[0] }));
    } else {
      const I = len / (NP - 1);
      let D = 0;
      out = [{ ...pts[0] }];
      const src = pts.map(p => ({ ...p }));
      for (let i = 1; i < src.length; i++) {
        if (src[i].id !== src[i - 1].id) continue;
        const d = dist(src[i - 1], src[i]);
        if (D + d >= I && d > 0) {
          const t = (I - D) / d;
          const q = { x: src[i - 1].x + t * (src[i].x - src[i - 1].x), y: src[i - 1].y + t * (src[i].y - src[i - 1].y), id: src[i].id };
          out.push(q);
          src.splice(i, 0, q);
          D = 0;
        } else D += d;
        if (out.length >= NP) break;
      }
      while (out.length < NP) out.push({ ...src[src.length - 1] });
    }
    let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
    out.forEach(p => { minX = Math.min(minX, p.x); minY = Math.min(minY, p.y); maxX = Math.max(maxX, p.x); maxY = Math.max(maxY, p.y); });
    const size = Math.max(maxX - minX, maxY - minY) || 1;
    out = out.map(p => ({ x: (p.x - minX) / size, y: (p.y - minY) / size }));
    const cx = out.reduce((a, p) => a + p.x, 0) / NP, cy = out.reduce((a, p) => a + p.y, 0) / NP;
    return out.map(p => ({ x: p.x - cx, y: p.y - cy }));
  }

  function cloudDistance(a, b, start) {
    const n = a.length, matched = new Array(n).fill(false);
    let sum = 0, i = start;
    do {
      let idx = -1, min = Infinity;
      for (let j = 0; j < n; j++) {
        if (matched[j]) continue;
        const d = (a[i].x - b[j].x) ** 2 + (a[i].y - b[j].y) ** 2;
        if (d < min) { min = d; idx = j; }
      }
      matched[idx] = true;
      sum += (1 - ((i - start + n) % n) / n) * Math.sqrt(min);
      i = (i + 1) % n;
    } while (i !== start);
    return sum;
  }

  function greedyMatch(a, b) {
    const step = Math.floor(Math.pow(NP, 0.5));
    let min = Infinity;
    for (let i = 0; i < NP; i += step) min = Math.min(min, cloudDistance(a, b, i), cloudDistance(b, a, i));
    return min;
  }

  const toPts = strokes => strokes.map(s => s.map(([x, y]) => ({ x, y })));
  const CLOUDS = [];
  const addCloud = (letter, s) => CLOUDS.push({ letter, set: setOf(letter), cloud: cloudOf(toPts(s)), aspect: aspectOf(toPts(s)) });
  Object.entries(TEMPLATES).forEach(([letter, s]) => addCloud(letter, s));
  Object.entries(VARIANTS).forEach(([letter, list]) => list.forEach(s => addCloud(letter, s)));
  // How much ink a neat copy of each letter uses relative to its size (m, w, g are "busy").
  const INK_DENSITY = {};
  Object.entries(TEMPLATES).forEach(([letter, s]) => {
    const pts = toPts(s), f = pts.flat();
    const xs = f.map(p => p.x), ys = f.map(p => p.y);
    const diag = Math.hypot(Math.max(...xs) - Math.min(...xs), Math.max(...ys) - Math.min(...ys));
    INK_DENSITY[letter] = pts.reduce((a, st) => a + polylineLength(st), 0) / Math.max(1, diag);
  });

  function aspectOf(strokes) {
    const f = strokes.flat();
    const xs = f.map(p => p.x), ys = f.map(p => p.y);
    const w = Math.max(...xs) - Math.min(...xs), h = Math.max(...ys) - Math.min(...ys);
    return Math.max(0.05, w) / Math.max(0.05, h);
  }

  function freeRecognize(inkStrokes, targetLetter, leniency = 0) {
    const strokes = inkStrokes.filter(s => s.length > 1);
    if (!strokes.length) return null;
    const flat = strokes.flat();
    const xs = flat.map(p => p.x), ys = flat.map(p => p.y);
    const w = Math.max(...xs) - Math.min(...xs), h = Math.max(...ys) - Math.min(...ys);
    const diag = Math.hypot(w, h);
    const inkLength = strokes.reduce((a, s) => a + polylineLength(s), 0);
    if (diag < 30) return { tooSmall: true };
    // Scribble: lots of ink packed into a small box.
    const isScribble = inkLength / Math.max(1, diag) > Math.max(4.4, (INK_DENSITY[targetLetter] || 0) * 1.6);
    const set = setOf(targetLetter);

    const cloud = cloudOf(strokes);
    const userAspect = Math.max(4, w) / Math.max(4, h);
    const byLetter = {};
    CLOUDS.forEach(t => {
      if (t.set !== set) return;          // never compare "a" with "A"
      let d = greedyMatch(cloud, t.cloud);
      // Gentle aspect-ratio tie-breaker (helps I vs L vs T, O vs Q stays shape-driven).
      d += Math.min(1.2, Math.abs(Math.log(userAspect / t.aspect)) * 0.6);
      if (!(t.letter in byLetter) || d < byLetter[t.letter]) byLetter[t.letter] = d;
    });
    const ranked = Object.entries(byLetter).map(([letter, d]) => ({ letter, d })).sort((a, b) => a.d - b.d);
    const best = ranked[0], second = ranked[1];
    const target = ranked.find(r => r.letter === targetLetter);
    const sameGroup = LOOKALIKE.some(g => g.includes(targetLetter) && g.includes(best.letter));
    // $P distances: a fair kid letter is ~0.4-1.6, scribbles/blobs are >2.
    const maxD = [1.9, 2.15, 2.4][clamp(leniency, 0, 2)];
    const targetOk = !isScribble && !!target && target.d < maxD && (
      target === best ||
      target.d <= best.d * 1.12 + 0.08 ||
      (sameGroup && target.d <= best.d * 1.3 + 0.12)
    );
    const confident = !isScribble && best.d < 1.8 && best.d <= second.d * 0.88;
    return { ranked: ranked.slice(0, 5), best, target, targetOk, confident, isScribble, inkLength, diag };
  }

  // ---------- Top-level decision ----------
  // verdict: pass | almost | other | retry | scribble | wait | empty
  function evaluate(guide, inkStrokes, targetLetter, { final = false, leniency = 0 } = {}) {
    const minLen = Math.max(8, guide.R * 0.3);
    // Taps count when they land on a dot (i, j); other tiny marks are ignored.
    const onDot = s => (guide.dotStrokes || []).some(i => s.every(p => dist(p, guide.strokes[i][0]) <= guide.R * 1.6));
    const real = inkStrokes.filter(s => s.length && (polylineLength(s) >= minLen || onDot(s)));
    if (!real.length) return { verdict: final ? "empty" : "wait" };
    const trace = traceReport(guide, real, leniency);
    if (trace.pass) return { verdict: "pass", letter: targetLetter, mode: "trace", trace };
    if (!final) return { verdict: "wait", trace };
    const free = freeRecognize(real, targetLetter, leniency);
    const clearTarget = free && free.targetOk && free.target === free.best && free.target.d < 1.5;
    // Child is clearly tracing but stopped early -> point at the missing part
    // (unless the drawing on its own is already an unmistakable target letter).
    if (trace.tracingEffort && !clearTarget) return { verdict: "almost", letter: targetLetter, trace, free };
    if (!free || free.tooSmall) return { verdict: trace.almost ? "almost" : "retry", trace, free };
    if (free.isScribble) return { verdict: "scribble", trace, free };
    // Off the guide but clearly the target letter (e.g. written next to it): still a win.
    if (free.targetOk) return { verdict: "pass", letter: targetLetter, mode: "free", trace, free };
    if (free.confident && free.best.letter !== targetLetter) return { verdict: "other", letter: free.best.letter, trace, free };
    if (trace.almost) return { verdict: "almost", letter: targetLetter, trace, free };
    return { verdict: "retry", trace, free };
  }

  return { TEMPLATES, RULE, isLower, ruledLines, layoutTransform, layoutStrokes, buildGuide, resetCoverage, markCoverage, traceReport, freeRecognize, evaluate, polylineLength, densify };
})();

// ==ARBITER START==
// Pure (DOM-free) touch arbiter: decides which contact may draw.
//  - one finger draws, everything else is ignored
//  - two fingers landing together (pinch / two-finger tap) cancel the fresh stroke
//    and lock drawing until the fingers lift
//  - a palm / big contact, or a thumb gripping the canvas edge, never draws
//  - a hand resting on the screen does NOT block the drawing finger
//  - a stylus always wins over touch (palm rejection for pen users)
const createTouchArbiter = (opts = {}) => {
  const cfg = {
    palmPx: 64,          // contact width/height (CSS px) treated as a palm
    edgePx: 12,          // touches starting this close to the canvas edge are grip, not ink
    youngMs: 140,        // a stroke younger than this...
    youngTravelPx: 18,   // ...and shorter than this is cancelled if a 2nd finger lands
    pairMs: 350,
    pinchMs: 600,        // a 2nd finger that slides this early in a stroke = pinch, cancel
    pinchTravelPx: 30,         // two touches landing within this window = two-finger gesture
    lockMaxMs: 1500,     // safety: a lock never outlives this without new touches
    ...opts
  };
  const contacts = new Map(); // id -> { type, t0, x0, y0, travel, role }
  let activeId = null;
  let lockedAt = -1;
  let penDown = false;

  const isLocked = now => lockedAt >= 0 && now - lockedAt < cfg.lockMaxMs;

  function down(e) {
    // e: { id, type, x, y, w, h, cw, ch, t, button }
    const c = { type: e.type, t0: e.t, x0: e.x, y0: e.y, x: e.x, y: e.y, travel: 0, role: "idle" };
    contacts.set(e.id, c);

    if (e.type === "mouse") {
      if (e.button !== 0 || activeId !== null) { c.role = "ignored"; return { action: "ignore", reason: "mouse-busy" }; }
      c.role = "ink"; activeId = e.id; return { action: "start" };
    }

    if (e.type === "pen") {
      penDown = true;
      const prev = activeId;
      c.role = "ink"; activeId = e.id; lockedAt = -1;
      if (prev !== null && prev !== e.id) {
        const p = contacts.get(prev); if (p) p.role = "ignored";
        return { action: "restart", cancelId: prev, reason: "pen-wins" };
      }
      return { action: "start" };
    }

    // ---- touch ----
    if (penDown) { c.role = "ignored"; return { action: "ignore", reason: "pen-active" }; }
    if ((e.w || 0) >= cfg.palmPx || (e.h || 0) >= cfg.palmPx) { c.role = "palm"; return { action: "ignore", reason: "palm" }; }
    if (e.x < cfg.edgePx || e.y < cfg.edgePx || e.x > e.cw - cfg.edgePx || e.y > e.ch - cfg.edgePx) {
      c.role = "grip"; return { action: "ignore", reason: "edge" };
    }
    if (isLocked(e.t)) { c.role = "ignored"; lockedAt = e.t; return { action: "ignore", reason: "locked" }; }
    lockedAt = -1;

    if (activeId !== null) {
      const a = contacts.get(activeId);
      const young = a && e.t - a.t0 < cfg.youngMs && a.travel < cfg.youngTravelPx;
      if (young) {
        // Two fingers came down together: drop the fresh stroke, wait for lift.
        const cancelId = activeId;
        a.role = "ignored"; c.role = "ignored"; activeId = null; lockedAt = e.t;
        return { action: "cancel", cancelId, reason: "two-fingers" };
      }
      c.role = "ignored";
      return { action: "ignore", reason: "already-drawing" };
    }

    // Nobody is drawing. Another finger that landed *just* before = two-finger tap.
    for (const [id, o] of contacts) {
      if (id === e.id || o.type !== "touch") continue;
      if ((o.role === "idle" || o.role === "ignored") && e.t - o.t0 < cfg.pairMs) {
        c.role = "ignored"; lockedAt = e.t;
        return { action: "ignore", reason: "two-finger-tap" };
      }
    }
    // Older resting contacts (palm, other hand, thumb) do not block a new finger.
    c.role = "ink"; activeId = e.id;
    return { action: "start" };
  }

  function move(e) {
    const c = contacts.get(e.id);
    if (!c) return { action: "ignore" };
    c.travel += Math.hypot(e.x - c.x, e.y - c.y);
    c.x = e.x; c.y = e.y;
    if (e.id === activeId) return { action: "draw" };
    // A second finger that slides while the stroke is still fresh = pinch/zoom attempt.
    if (activeId !== null && c.type === "touch" && c.role === "ignored" && c.travel > cfg.pinchTravelPx) {
      const a = contacts.get(activeId);
      if (a && a.type === "touch" && e.t - a.t0 < cfg.pinchMs) {
        const cancelId = activeId;
        a.role = "ignored"; activeId = null; lockedAt = e.t;
        return { action: "cancel", cancelId, reason: "pinch" };
      }
    }
    return { action: "ignore" };
  }

  function up(e) {
    const c = contacts.get(e.id);
    contacts.delete(e.id);
    if (c && c.type === "pen") penDown = [...contacts.values()].some(o => o.type === "pen");
    if (![...contacts.values()].some(o => o.type === "touch")) lockedAt = -1;
    if (e.id === activeId) { activeId = null; return { action: "end" }; }
    return { action: "ignore" };
  }

  function reset() { contacts.clear(); activeId = null; lockedAt = -1; penDown = false; }

  return { down, move, up, reset, get activeId() { return activeId; }, get size() { return contacts.size; }, cfg };
};
// ==ARBITER END==

// Garden world: fruit & vegetables A–Z, all hand-made SVG (viewBox 0 0 100 100).
const GARDEN_ITEMS = {

          if (Number.isFinite(d.stars) && d.stars >= 0) stars = Math.floor(d.stars);
          WORLD_KEYS.forEach(w => {
            (d.found && Array.isArray(d.found[w]) ? d.found[w] : []).forEach(L => { if (targetLetters.includes(L)) foundBy[w].add(L); });
            const p = d.pos && d.pos[w];
            if (Number.isInteger(p) && p >= 0 && p < targetLetters.length) pos[w] = p;
          });
          audioEnabled = d.sound !== false;
        } catch (err) { /* start fresh */ }
      }
      function saveProgress() {
        try {
          window.localStorage.setItem(STORE_KEY, JSON.stringify({
            v: 1, world, letterCase, stars, pos, sound: audioEnabled,
            found: Object.fromEntries(WORLD_KEYS.map(k => [k, [...foundBy[k]]]))
          }));
        } catch (err) { /* storage is optional */ }
      }

      // ---------- canvas sizing ----------
      function resizeCanvases() {
        const rect = canvasWrap.getBoundingClientRect();
        const newW = Math.max(1, rect.width), newH = Math.max(1, rect.height);
        const newRatio = window.devicePixelRatio || 1;
        if (Math.abs(newW - width) < 0.5 && Math.abs(newH - height) < 0.5 && newRatio === ratio && guide) return;

        // Keep the child's ink glued to the letter when the canvas changes size
        // (mobile URL bar hiding, rotation, split screen...).
        if (width > 1 && height > 1 && strokes.length) {
          const a = LetterEngine.layoutTransform(targetLetter, width, height);
          const b = LetterEngine.layoutTransform(targetLetter, newW, newH);
          const map = p => ({ x: (p.x - a.offX) / a.scale * b.scale + b.offX, y: (p.y - a.offY) / a.scale * b.scale + b.offY });
          strokes = strokes.map(s => s.map(map));
          currentStroke = currentStroke.map(map);
        }

        width = newW; height = newH; ratio = newRatio;
        [drawCanvas, guideCanvas, inkCanvas].forEach(canvas => {
          canvas.width = Math.floor(width * ratio);
          canvas.height = Math.floor(height * ratio);
          if (canvas !== inkCanvas) { canvas.style.width = `${width}px`; canvas.style.height = `${height}px`; }
          canvas.getContext("2d").setTransform(ratio, 0, 0, ratio, 0, 0);
        });

        guide = LetterEngine.buildGuide(targetLetter, width, height);
        recomputeCoverage();
        rebuildInkCache();
        cancelTeachingAnimation();
        drawGuide();
        render();
      }

      function recomputeCoverage() {
        if (!guide) return;
        LetterEngine.resetCoverage(guide);
        strokes.forEach(s => LetterEngine.markCoverage(guide, s));
        if (currentStroke.length) LetterEngine.markCoverage(guide, currentStroke);
      }

      // ---------- ink rendering ----------
      function strokePath(ctx, stroke) {
        ctx.beginPath();
        ctx.moveTo(stroke[0].x, stroke[0].y);
        for (let i = 1; i < stroke.length; i++) {
          const midX = (stroke[i - 1].x + stroke[i].x) / 2;
          const midY = (stroke[i - 1].y + stroke[i].y) / 2;
          ctx.quadraticCurveTo(stroke[i - 1].x, stroke[i - 1].y, midX, midY);
        }
        const last = stroke[stroke.length - 1];
        ctx.lineTo(last.x, last.y);
      }

      function drawInkStroke(ctx, stroke) {
        if (!stroke.length) return;
        const lw = lineWidthInk();
        ctx.save();
        ctx.lineCap = "round";
        ctx.lineJoin = "round";
        if (stroke.length === 1) {
          // A tap still leaves a visible dot, so little fingers always get feedback.
          ctx.fillStyle = "#4f7cff";
          ctx.beginPath(); ctx.arc(stroke[0].x, stroke[0].y, lw / 2, 0, Math.PI * 2); ctx.fill();
          ctx.restore();
          return;
        }
        strokePath(ctx, stroke);
        // Cheap glow instead of shadowBlur (shadowBlur is very slow on budget tablets).
        ctx.lineWidth = lw + 9; ctx.strokeStyle = "rgba(79, 124, 255, 0.16)"; ctx.stroke();
        ctx.lineWidth = lw; ctx.strokeStyle = "#4f7cff"; ctx.stroke();
        ctx.lineWidth = Math.max(5, Math.min(10, width / 74)); ctx.strokeStyle = "rgba(255,255,255,0.75)"; ctx.stroke();
        ctx.restore();
      }

      function rebuildInkCache() {
        ictx.clearRect(0, 0, width, height);
        strokes.forEach(s => drawInkStroke(ictx, s));
      }

      function render() {
        renderQueued = false;
        dctx.clearRect(0, 0, width, height);
        dctx.drawImage(inkCanvas, 0, 0, width, height);
        if (currentStroke.length) drawInkStroke(dctx, currentStroke);
      }

      function queueRender() {
        if (renderQueued) return;
        renderQueued = true;
        requestAnimationFrame(render);
      }

      // ---------- guide rendering (dots that light up as you trace) ----------
      function queueGuide() {
        if (guideQueued) return;
        guideQueued = true;
        requestAnimationFrame(() => { guideQueued = false; drawGuide(); });
      }

      function nextStrokeToTrace() {
        if (!guide) return 0;
        for (let i = 0; i < guide.strokes.length; i++) {
          const dots = guide.dots.filter(d => d.stroke === i);
          const lit = dots.filter(d => d.covered).length;
          if (lit / dots.length < 0.6) return i;
        }
        return -1;
      }

      // School lines for lowercase: top line, dashed midline, strong baseline, faint
      // descender line. Letters sit on them at their true size (o short, h tall, p hangs).
      function drawRuledLines(ctx) {
        const L = LetterEngine.ruledLines(width, height);
        const x0 = Math.max(10, width * 0.04), x1 = width - x0;
        const line = (y, color, lw, dash) => {
          ctx.save();
          ctx.strokeStyle = color; ctx.lineWidth = lw; ctx.lineCap = "round";
          ctx.setLineDash(dash || []);
          ctx.beginPath(); ctx.moveTo(x0, y); ctx.lineTo(x1, y); ctx.stroke();
          ctx.restore();
        };
        line(L.top, "rgba(79, 124, 255, 0.45)", 3);
        line(L.mid, "rgba(255, 111, 177, 0.70)", 3, [16, 12]);
        line(L.base, "rgba(36, 59, 107, 0.65)", 5);
        line(L.desc, "rgba(79, 124, 255, 0.28)", 3, [10, 12]);
      }

      function drawGuide() {
        if (teaching || !guide) return;
        gctx.clearRect(0, 0, width, height);
        if (guide.lower) drawRuledLines(gctx);
        const roadW = Math.max(18, guide.R * 1.1);

        // Soft "road" so the letter shape is obvious even before tracing.
        gctx.save();
        gctx.lineCap = "round"; gctx.lineJoin = "round";
        gctx.lineWidth = roadW;
        gctx.strokeStyle = "rgba(124, 92, 255, 0.10)";
        guide.strokes.forEach(s => {
          gctx.beginPath(); gctx.moveTo(s[0].x, s[0].y);
          for (let i = 1; i < s.length; i++) gctx.lineTo(s[i].x, s[i].y);
          gctx.stroke();
        });
        gctx.restore();

        const r = Math.max(5, Math.min(11, guide.spacing * 0.32));
        const glowing = new Set(glowDots || []);
        guide.dots.forEach(d => {
          gctx.beginPath();
          if (d.covered) {
            gctx.fillStyle = "#ffc93c";
            gctx.arc(d.x, d.y, r * 1.25, 0, Math.PI * 2);
          } else if (glowing.has(d)) {
            gctx.fillStyle = "#ff4fa3";
            gctx.arc(d.x, d.y, r * 1.45, 0, Math.PI * 2);
          } else {
            gctx.fillStyle = "rgba(124, 92, 255, 0.55)";
            gctx.arc(d.x, d.y, r, 0, Math.PI * 2);
          }
          gctx.fill();
          if (glowing.has(d) && !d.covered) {
            gctx.strokeStyle = "rgba(255, 79, 163, 0.35)";
            gctx.lineWidth = 6;
            gctx.beginPath(); gctx.arc(d.x, d.y, r * 2.4, 0, Math.PI * 2); gctx.stroke();
          }
        });

        // The dot on i / j: one big tap target instead of two tiny guide dots.
        (guide.dotStrokes || []).forEach(si => {
          const mine = guide.dots.filter(d => d.stroke === si);
          const lit = mine.some(d => d.covered);
          const p = guide.strokes[si][0];
          gctx.beginPath();
          gctx.fillStyle = lit ? "#ffc93c" : "rgba(124, 92, 255, 0.55)";
          gctx.arc(p.x, p.y, Math.max(r * 2, guide.R * 0.5), 0, Math.PI * 2);
          gctx.fill();
        });

        // Green numbered start dot + arrow on the next stroke to trace.
        const next = nextStrokeToTrace();
        if (next >= 0 && !drawing) {
          const s = guide.strokes[next];
          drawStartDot(s[0], next + 1, "#4bd269", "#1f9e45");
          // The dot on i / j is a tap, not a line: no arrow for it.
          if (!(guide.dotStrokes || []).includes(next)) drawArrow(s[0], s[1]);
        }
      }

      function drawArrow(a, b) {
        const ang = Math.atan2(b.y - a.y, b.x - a.x);
        const len = Math.min(dist(a, b) * 0.5, Math.max(34, guide.R * 1.4));
        const sx = a.x + Math.cos(ang) * guide.R * 0.9, sy = a.y + Math.sin(ang) * guide.R * 0.9;
        const ex = sx + Math.cos(ang) * len, ey = sy + Math.sin(ang) * len;
        gctx.save();
        gctx.strokeStyle = "#1f9e45"; gctx.fillStyle = "#1f9e45";
        gctx.lineWidth = 5; gctx.lineCap = "round";
        gctx.beginPath(); gctx.moveTo(sx, sy); gctx.lineTo(ex, ey); gctx.stroke();
        const h = 13;
        gctx.beginPath();
        gctx.moveTo(ex + Math.cos(ang) * 4, ey + Math.sin(ang) * 4);
        gctx.lineTo(ex - Math.cos(ang - 0.6) * h, ey - Math.sin(ang - 0.6) * h);
        gctx.lineTo(ex - Math.cos(ang + 0.6) * h, ey - Math.sin(ang + 0.6) * h);
        gctx.closePath(); gctx.fill();
        gctx.restore();
      }

      function drawStartDot(point, number, fill = "#ffd85a", ring = "#ff9f43") {
        gctx.save();
        gctx.fillStyle = fill;
        gctx.strokeStyle = ring;
        gctx.lineWidth = 4;
        gctx.beginPath();
        gctx.arc(point.x, point.y, Math.max(15, Math.min(width, height) / 30), 0, Math.PI * 2);
        gctx.fill();
        gctx.stroke();
        gctx.fillStyle = "#ffffff";
        gctx.font = `900 ${Math.max(16, Math.min(width, height) / 22)}px "Comic Sans MS", system-ui, sans-serif`;
        gctx.textAlign = "center";
        gctx.textBaseline = "middle";
        gctx.fillText(String(number), point.x, point.y + 1);
        gctx.restore();
      }

      // ---------- teaching animation ("this is how we write X") ----------
      function cancelTeachingAnimation() {
        teachingAnimationToken += 1;
        teaching = false;
        if (teachingAnimationId) { cancelAnimationFrame(teachingAnimationId); teachingAnimationId = null; }
      }

      function polyLen(points) { let s = 0; for (let i = 1; i < points.length; i++) s += dist(points[i - 1], points[i]); return s; }

      function pointAt(points, frac) {
        const target = polyLen(points) * frac;
        let acc = 0;
        for (let i = 1; i < points.length; i++) {
          const seg = dist(points[i - 1], points[i]);
          if (acc + seg >= target) { const t = seg ? (target - acc) / seg : 0; return { x: lerp(points[i - 1].x, points[i].x, t), y: lerp(points[i - 1].y, points[i].y, t) }; }
          acc += seg;
        }
        return points[points.length - 1];
      }

      function drawTeachingStroke(points, progress, color, lw) {
        if (points.length < 2 || progress <= 0) return;
        const total = polyLen(points), target = total * Math.min(1, progress);
        let travelled = 0;
        gctx.save();
        gctx.lineCap = "round"; gctx.lineJoin = "round";
        gctx.lineWidth = lw; gctx.strokeStyle = color;
        gctx.beginPath(); gctx.moveTo(points[0].x, points[0].y);
        for (let i = 1; i < points.length; i++) {
          const seg = dist(points[i - 1], points[i]);
          if (travelled + seg <= target) { gctx.lineTo(points[i].x, points[i].y); travelled += seg; }
          else { const t = Math.max(0, Math.min(1, (target - travelled) / seg)); gctx.lineTo(lerp(points[i - 1].x, points[i].x, t), lerp(points[i - 1].y, points[i].y, t)); break; }
        }
        gctx.stroke();
        gctx.lineWidth = Math.max(4, lw * 0.36); gctx.strokeStyle = "rgba(255,255,255,0.78)"; gctx.stroke();
        gctx.restore();
      }

      function animateLetter(letter, onDone) {
        cancelTeachingAnimation();
        teaching = true;
        const token = teachingAnimationToken;
        const tStrokes = LetterEngine.layoutStrokes(letter, width, height);
        const duration = Math.max(2300, tStrokes.length * 900 + 700);
        const lw = Math.max(16, Math.min(34, width / 26));
        const start = performance.now();

        function frame(now) {
          if (token !== teachingAnimationToken) return;
          const progress = Math.min(1, (now - start) / duration);
          const active = progress * tStrokes.length;
          gctx.clearRect(0, 0, width, height);
          if (LetterEngine.isLower(letter)) drawRuledLines(gctx);
          gctx.save();
          gctx.fillStyle = "#4f3cc9";
          gctx.font = `900 ${Math.max(22, Math.min(width, height) / 18)}px "Comic Sans MS", system-ui, sans-serif`;
          gctx.textAlign = "center"; gctx.textBaseline = "top";
          gctx.fillText(`This is how we write ${letter}!`, width / 2, 12);
          gctx.restore();
          tStrokes.forEach((s, i) => {
            const p = Math.max(0, Math.min(1, active - i));
            drawTeachingStroke(s, p, i % 2 ? "#ff6fb1" : "#00b894", lw);
            drawStartDot(s[0], i + 1);
            if (p > 0 && p < 1) {
              const q = pointAt(s, p);
              gctx.save();
              gctx.font = `${Math.max(24, Math.min(width, height) / 13)}px system-ui, sans-serif`;
              gctx.textAlign = "center"; gctx.textBaseline = "middle";
              gctx.fillText("⭐", q.x, q.y);
              gctx.restore();
            }
          });
          if (progress < 1) teachingAnimationId = requestAnimationFrame(frame);
          else {
            teachingAnimationId = null;
            setTimeout(() => {
              if (token !== teachingAnimationToken) return;
              teaching = false;
              if (onDone) onDone(); else drawGuide();
            }, 700);
          }
        }
        teachingAnimationId = requestAnimationFrame(frame);
      }

      // ---------- input (one finger draws; multi-touch rejected) ----------
      function toArb(e) {
        const r = drawCanvas.getBoundingClientRect();
        return {
          id: e.pointerId, type: e.pointerType || "mouse", button: e.button,
          x: e.clientX - r.left, y: e.clientY - r.top,
          w: e.width || 0, h: e.height || 0, cw: r.width, ch: r.height,
          t: performance.now()
        };
      }

      function canvasPoint(ev) {
        const r = drawCanvas.getBoundingClientRect();
        return {
          x: Math.max(0, Math.min(width, ev.clientX - r.left)),
          y: Math.max(0, Math.min(height, ev.clientY - r.top))
        };
      }

      function onPointerDown(e) {
        e.preventDefault();
        if (phase !== "play") return;
        const res = arbiter.down(toArb(e));
        if (res.action === "cancel" || res.action === "restart") cancelCurrentStroke(res.reason);
        if (res.action === "start" || res.action === "restart") beginStroke(e);
      }

      function onPointerMove(e) {
        const res = arbiter.move(toArb(e));
        if (res.action === "cancel") { cancelCurrentStroke(res.reason); return; }
        if (res.action !== "draw" || !drawing) return;
        e.preventDefault();
        const events = typeof e.getCoalescedEvents === "function" ? e.getCoalescedEvents() : [];
        const list = events.length ? events : [e];
        const added = [];
        for (const ev of list) {
          const p = canvasPoint(ev);
          const last = currentStroke[currentStroke.length - 1];
          if (!last || dist(last, p) >= 0.75) { currentStroke.push(p); added.push(p); }
        }
        if (!added.length) return;
        const before = currentStroke[currentStroke.length - added.length - 1];
        const lit = LetterEngine.markCoverage(guide, before ? [before, ...added] : added);
        if (lit) { queueGuide(); pling(); }
        queueRender();
      }

      function onPointerUp(e) {
        const res = arbiter.up({ id: e.pointerId, t: performance.now() });
        if (res.action === "end" && drawing) endStroke();
      }

      function beginStroke(e) {
        // If old ink was waiting to be wiped (after a wrong letter), wipe it now so
        // the new attempt starts clean; otherwise just stop the "are you done?" timer.
        if (wipeTimer) clearDrawing(true); else clearTimers();
        unlockSpeech();
        ensureAudio();
        if (teaching) cancelTeachingAnimation();
        try { drawCanvas.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ }
        drawing = true;
        hint.classList.add("hidden");
        currentStroke = [canvasPoint(e)];
        LetterEngine.markCoverage(guide, currentStroke);
        drawGuide();
        queueRender();
        playTinyTap();
      }

      function endStroke() {
        drawing = false;
        if (currentStroke.length) {
          const s = simplifyStroke(currentStroke);
          strokes.push(s);
          drawInkStroke(ictx, s);
          if (s.length > 1) sparkleAt(s[s.length - 1]);
        }
        currentStroke = [];
        queueRender();
        drawGuide();
        afterStroke();
      }

      function cancelCurrentStroke(reason) {
        if (drawing) {
          drawing = false;
          currentStroke = [];
          recomputeCoverage();
          queueRender();
          drawGuide();
        }
        const now = performance.now();
        if (now - lastOneFingerNudge > 4000) {
          lastOneFingerNudge = now;
          showToast("☝️ One finger, please!");
        }
      }

      function simplifyStroke(stroke) {
        const out = [];
        stroke.forEach(p => { if (!out.length || dist(out[out.length - 1], p) > 2) out.push(p); });
        const last = stroke[stroke.length - 1];
        if (out.length && out[out.length - 1] !== last && dist(out[out.length - 1], last) > 0.5) out.push(last);
        return out;
      }

      // ---------- checking the letter ----------
      function afterStroke() {
        if (phase !== "play") return;
        const res = LetterEngine.evaluate(guide, strokes, targetLetter, { final: false, leniency });
        if (res.verdict === "pass") {
          phase = "celebrate";
          clearTimers();
          celebrateTimer = setTimeout(() => succeed(res), 260);
          return;
        }
        clearTimeout(idleTimer);
        idleTimer = setTimeout(() => finalCheck(false), IDLE_CHECK_MS);
      }

      function finalCheck(manual) {
        clearTimeout(idleTimer); idleTimer = null;
        if (phase !== "play" || drawing) return;
        let res = LetterEngine.evaluate(guide, strokes, targetLetter, { final: true, leniency });

        // Never let a 3-year-old get stuck: third "almost" with real effort counts.
        if (res.verdict === "almost" && leniency >= 2 && res.trace && res.trace.coverage >= 0.45) {
          res = { ...res, verdict: "pass" };
        }

        switch (res.verdict) {
          case "pass":
            phase = "celebrate";
            succeed(res);
            break;
          case "almost":
            leniency = Math.min(2, leniency + 1);
            glowDots = res.trace.uncovered;
            drawGuide();
            message.textContent = "Almost! Trace the pink dots ✨";
            showToast("Almost! Follow the pink dots ✨");
            say("Almost! Follow the pink dots.");
            boop(true);
            break;
          case "other":
            revealOther(res.letter);
            break;
          case "scribble":
            clearDrawing(true);
            message.textContent = "Wow, lots of lines! Let's follow the dots.";
            say(`Let's follow the dots to make ${spoken(targetLetter)}.`);
            boop(true);
            animateLetter(targetLetter);
            break;
          case "retry":
            leniency = Math.min(2, leniency + 1);
            clearDrawing(true);
            message.textContent = `Watch! Then start at the green dot.`;
            say(`Watch me make ${spoken(targetLetter)}. Then you try!`);
            boop(true);
            animateLetter(targetLetter);
            break;
          default: // empty
            if (manual) { showToast("Start at the green dot! 🟢"); say("Start at the green dot."); }
            else if (strokes.length) clearDrawing(true);
        }
      }

      function succeed() {
        clearTimers();
        // Remember progress right away, so leaving mid-celebration still moves on.
        pos[world] = (targetIndex + 1) % targetLetters.length;
        revealItem(targetLetter, true);
        clearTimeout(nextTimer);
        nextTimer = setTimeout(nextTarget, 4600);
      }

      function revealOther(letter) {
        revealItem(letter, false);
        message.textContent = `That looks like ${letter}! Now can you trace ${targetLetter}?`;
        wipeTimer = setTimeout(() => clearDrawing(true), 5200);
      }

      function revealItem(letter, isTarget) {
        const W = WORLDS[world];
        const L = letter.toUpperCase();
        const item = getItemForLetter(letter);
        const alreadyFound = foundSet().has(L);
        setPicture(item);
        recognized.textContent = `I see ${letter}!`;
        animalName.textContent = `${letter} is for ${item.name}!`;
        const praise = W.praise[Math.floor(Math.random() * W.praise.length)];

        if (isTarget) {
          message.textContent = `${praise} ${W.cheer(item)}`;
          stars += alreadyFound ? 1 : 3;
          animateLetter(letter, () => {});
          promptSubtitle.textContent = "Great job! A new letter is coming...";
        } else {
          stars += alreadyFound ? 0 : 1;
        }

        foundSet().add(L);
        saveProgress();
        updateScore();
        markLetter();
        animalCard.classList.remove("pop");
        void animalCard.offsetWidth;
        animalCard.classList.add("pop");
        burstConfetti(isTarget ? 70 : 36);
        cheer(L, isTarget);
        speakItem(L, item);
        showToast(isTarget ? `You did ${letter}! ⭐⭐⭐` : `${letter} is for ${item.name}!`);
      }

      function updateScore() {
        starsEl.textContent = stars;
        foundCountEl.textContent = foundSet().size;
      }

      function markLetter() {
        const base = targetLetter.toUpperCase();
        alphabetChips.forEach((chip, l) => {
          const has = foundSet().has(l);
          chip.textContent = inCase(l);
          chip.classList.toggle("found", has);
          chip.classList.toggle("target", l === base);
          chip.setAttribute("aria-label", `${inCase(l)}${has ? " discovered" : " not discovered yet"}${l === base ? ", current target" : ""}`);
        });
      }

      function clearDrawing(keepMessage = false) {
        clearTimers();
        strokes = [];
        currentStroke = [];
        glowDots = null;
        ictx.clearRect(0, 0, width, height);
        if (guide) LetterEngine.resetCoverage(guide);
        hint.classList.remove("hidden");
        if (!keepMessage) message.textContent = "Start at the green dot and follow the dots!";
        if (!teaching) drawGuide();
        render();
      }

      function resetAnimalStageForTracing() {
        if ("speechSynthesis" in window) window.speechSynthesis.cancel();
        animalCard.classList.remove("pop");
        setPicture({ emoji: "✏️" });
        recognized.textContent = "";
        animalName.textContent = "Trace the letter";
        message.textContent = "Start at the green dot and follow the dots!";
      }

      // letter: any case; it is shown in the current case (ABC / abc).
      function setTarget(letter) {
        targetLetter = inCase(letter);
        targetIndex = targetLetters.indexOf(letter.toUpperCase());
        pos[world] = targetIndex;
        targetLetterEl.innerHTML = letterSVG(targetLetter);
        targetLetterEl.setAttribute("aria-label", `Target letter ${targetLetter}`);
        promptTitle.textContent = `Can you trace ${targetLetter}?`;
        promptSubtitle.textContent = "Start at the green dot. Follow the dots!";
        canvasWrap.classList.toggle("ruled", isLowerCase());
        leniency = 0;
        glowDots = null;
        guide = LetterEngine.buildGuide(targetLetter, width, height);
      }

      function stopEverything() {
        clearTimers();
        clearTimeout(nextTimer); nextTimer = null;
        clearTimeout(celebrateTimer); celebrateTimer = null;
        cancelTeachingAnimation();
        drawing = false;
        currentStroke = [];
        arbiter.reset();
      }

      // Start (or restart) tracing `letter` with a clean page.
      function startLetter(letter, speak = true) {
        stopEverything();
        setTarget(letter);
        resetAnimalStageForTracing();
        markLetter();
        clearDrawing(true);
        phase = "play";
        saveProgress();
        if (speak) say(`Can you trace ${spoken(targetLetter)}?`, 350);
      }

      function nextTarget() {
        startLetter(targetLetters[(targetIndex + 1) % targetLetters.length]);
      }

      // ---------- ABC ⇄ abc ----------
      function updateCaseButton() {
        caseButton.classList.toggle("lower", isLowerCase());
        caseButton.setAttribute("aria-pressed", String(isLowerCase()));
        caseButton.setAttribute("aria-label", isLowerCase() ? "Small letters. Tap for big letters" : "Big letters. Tap for small letters");
      }

      function toggleCase() {
        letterCase = isLowerCase() ? "upper" : "lower";
        updateCaseButton();
        // Same letter, other case: A -> a -> A. Found items are shared between cases.
        startLetter(targetLetter.toUpperCase(), false);
        say(isLowerCase() ? `Small letters! Can you trace ${spoken(targetLetter)}?` : `Big letters! Can you trace ${spoken(targetLetter)}?`, 200);
        showToast(isLowerCase() ? "abc  small letters" : "ABC  big letters");
      }

      // ---------- worlds + home screen ----------
      function applyWorld() {
        const W = WORLDS[world];
        WORLD_KEYS.forEach(k => document.body.classList.toggle(`world-${k}`, k === world));
        appTitle.textContent = W.title;
        appSubtitle.textContent = W.subtitle;
        foundLabelEl.textContent = W.foundLabel;
        foundIconEl.textContent = W.icon;
        updateScore();
      }

      function updateHomeProgress() {
        const n = targetLetters.length;
        worldButtons.forEach(btn => {
          const k = btn.dataset.world;
          const prog = btn.querySelector(".world-progress");
          if (prog && foundBy[k]) prog.textContent = `⭐ ${foundBy[k].size} / ${n}`;
          btn.classList.toggle("last", k === world);
        });
      }

      function showHome(speak) {
        stopEverything();
        if ("speechSynthesis" in window) window.speechSynthesis.cancel();
        phase = "home";
        updateHomeProgress();
        homeEl.classList.remove("hidden");
        homeEl.setAttribute("aria-hidden", "false");
        if (speak) say("Where shall we play?", 120);
      }

      function chooseWorld(key) {
        ensureAudio(); unlockSpeech();
        world = WORLDS[key] ? key : "zoo";
        homeEl.classList.add("hidden");
        homeEl.setAttribute("aria-hidden", "true");
        applyWorld();
        startLetter(targetLetters[pos[world]] || "A", false);
        const W = WORLDS[world];
        if (W.hello) setPicture({ emoji: W.hello });
        else setPicture(W.items("A")[0]);
        recognized.textContent = "Hello, little writer!";
        animalName.textContent = W.welcome;
        message.textContent = W.intro;
        say(`${W.welcome}! Can you trace ${spoken(targetLetter)}?`, 200);
        boop();
      }

      // ---------- effects ----------
      function showToast(text) {
        toast.textContent = text;
        toast.classList.add("show");
        clearTimeout(showToast.timer);
        showToast.timer = setTimeout(() => toast.classList.remove("show"), 1600);
      }

      function burstConfetti(count) {
        const colors = ["#ff6fb1", "#ffd85a", "#4bd269", "#7c5cff", "#00cec9", "#ff9f43"];
        for (let i = 0; i < count; i++) {
          const piece = document.createElement("div");
          piece.className = "confetti";
          piece.style.left = `${Math.random() * 100}vw`;
          piece.style.top = `${-8 - Math.random() * 20}vh`;
          piece.style.background = colors[i % colors.length];
          piece.style.setProperty("--dur", `${1.6 + Math.random() * 1.6}s`);
          piece.style.setProperty("--drift", `${-80 + Math.random() * 160}px`);
          piece.style.setProperty("--spin", `${360 + Math.random() * 720}deg`);
          piece.style.setProperty("--rot", `${Math.random() * 180}deg`);
          document.body.appendChild(piece);
          piece.addEventListener("animationend", () => piece.remove(), { once: true });
        }
      }

      function sparkleAt(point) {
        if (!point) return;
        const icons = ["✨", "⭐", "💫", "🌟"];
        const rect = drawCanvas.getBoundingClientRect();
        for (let i = 0; i < 5; i++) {
          const sp = document.createElement("div");
          sp.className = "sparkle";
          sp.textContent = icons[Math.floor(Math.random() * icons.length)];
          sp.style.left = `${rect.left + point.x}px`;
          sp.style.top = `${rect.top + point.y}px`;
          sp.style.setProperty("--dx", `${-45 + Math.random() * 90}px`);
          sp.style.setProperty("--dy", `${-55 + Math.random() * 60}px`);
          document.body.appendChild(sp);
          sp.addEventListener("animationend", () => sp.remove(), { once: true });
        }
      }

      // ---------- audio ----------
      function ensureAudio() {
        if (!audioEnabled) return null;
        if (!audioCtx) {
          const Context = window.AudioContext || window.webkitAudioContext;
          if (!Context) return null;
          audioCtx = new Context();
        }
        if (audioCtx.state === "suspended") audioCtx.resume();
        return audioCtx;
      }

      function tone(freq, duration, type = "sine", delay = 0, gainValue = 0.06) {
        const ctx = ensureAudio();
        if (!ctx) return;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, ctx.currentTime + delay);
        gain.gain.setValueAtTime(0.0001, ctx.currentTime + delay);
        gain.gain.exponentialRampToValueAtTime(gainValue, ctx.currentTime + delay + 0.018);
        gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + delay + duration);
        osc.connect(gain).connect(ctx.destination);
        osc.start(ctx.currentTime + delay);
        osc.stop(ctx.currentTime + delay + duration + 0.02);
      }

      function cheer(letter, big) {
        if (!audioEnabled) return;
        const base = 240 + (letter.toUpperCase().charCodeAt(0) - 65) * 9;
        tone(base, 0.14, "triangle", 0, 0.055);
        tone(base * 1.25, 0.14, "triangle", 0.13, 0.065);
        tone(base * 1.5, 0.18, "triangle", 0.26, 0.075);
        if (big) tone(base * 2, 0.22, "sine", 0.43, 0.055);
      }

      // Only happy sounds: no "wrong" buzzer for preschoolers.
      function boop() { if (audioEnabled) tone(540, 0.15, "triangle", 0, 0.04); }
      function playTinyTap() { if (audioEnabled) tone(640, 0.035, "sine", 0, 0.015); }

      // Rising "pling" as dots light up: progress you can hear.
      function pling() {
        if (!audioEnabled || !guide) return;
        const now = performance.now();
        if (now - lastPling < 70) return;
        lastPling = now;
        const frac = guide.dots.filter(d => d.covered).length / guide.dots.length;
        tone(520 + 520 * frac, 0.06, "sine", 0, 0.025);
      }

      function chooseVoice() {
        if (!("speechSynthesis" in window)) return null;
        const voices = window.speechSynthesis.getVoices();
        preferredVoice =
          voices.find(v => /^en(-|_)?/i.test(v.lang) && /female|samantha|victoria|karen|zira|google/i.test(v.name)) ||
          voices.find(v => /^en(-|_)?/i.test(v.lang)) || voices[0] || null;
        return preferredVoice;
      }

      function unlockSpeech() {
        if (speechUnlocked || !audioEnabled || !("speechSynthesis" in window)) return;
        speechUnlocked = true;
        chooseVoice();
        try {
          const warmup = new SpeechSynthesisUtterance(" ");
          warmup.volume = 0;
          if (preferredVoice) warmup.voice = preferredVoice;
          window.speechSynthesis.speak(warmup);
          window.speechSynthesis.cancel();
        } catch (error) { /* speech is optional */ }
      }

      function say(text, delay = 60) {
        if (!audioEnabled || !speechUnlocked || !("speechSynthesis" in window)) return;
        const speak = () => {
          const u = new SpeechSynthesisUtterance(text);
          u.lang = "en-US"; u.rate = 0.8; u.pitch = 1.18; u.volume = 1;
          const voice = chooseVoice();
          if (voice) u.voice = voice;
          window.speechSynthesis.cancel();
          setTimeout(() => window.speechSynthesis.speak(u), delay);
        };
        if (window.speechSynthesis.getVoices().length === 0) {
          window.speechSynthesis.onvoiceschanged = () => { window.speechSynthesis.onvoiceschanged = null; speak(); };
          setTimeout(speak, 250);
        } else speak();
      }

      function speakItem(letter, item) {
        speechUnlocked = speechUnlocked || audioEnabled;
        say(`${letter} is for ${item.name}`);
      }

      function updateSoundButton() { soundButton.textContent = audioEnabled ? "🔊 Sound On" : "🔇 Sound Off"; }

      function toggleSound() {
        audioEnabled = !audioEnabled;
        updateSoundButton();
        saveProgress();
        if (audioEnabled) { ensureAudio(); boop(); showToast("Sound on!"); }
        else { if ("speechSynthesis" in window) window.speechSynthesis.cancel(); showToast("Sound off"); }
      }

      // ---------- install ----------
      async function installWebApp() {
        if (!deferredInstallPrompt) { showToast("Use your browser menu to add this game to the home screen."); return; }
        deferredInstallPrompt.prompt();
        await deferredInstallPrompt.userChoice;
        deferredInstallPrompt = null;
        installButton.classList.remove("show");
      }

      function setupWebAppInstall() {
        if ("serviceWorker" in navigator) {
          window.addEventListener("load", () => { navigator.serviceWorker.register("./sw.js").catch(() => {}); });
        }
        window.addEventListener("beforeinstallprompt", event => {
          event.preventDefault();
          deferredInstallPrompt = event;
          installButton.classList.add("show");
        });
        window.addEventListener("appinstalled", () => {
          deferredInstallPrompt = null;
          installButton.classList.remove("show");
          showToast("Magic Letter Zoo installed!");
        });
      }

      // ---------- wiring ----------
      function initEvents() {
        drawCanvas.addEventListener("pointerdown", onPointerDown);
        drawCanvas.addEventListener("pointermove", onPointerMove);
        // Listen on window so a finger lifted outside the canvas is never "stuck down".
        window.addEventListener("pointerup", onPointerUp);
        window.addEventListener("pointercancel", onPointerUp);
        drawCanvas.addEventListener("lostpointercapture", e => {
          if (drawing && e.pointerId === arbiter.activeId) onPointerUp(e);
        });

        // Stop the browser from hijacking little fingers: no pinch-zoom, no
        // long-press menus, no text-selection magnifier, no pull-to-refresh.
        canvasWrap.addEventListener("touchmove", e => e.preventDefault(), { passive: false });
        canvasWrap.addEventListener("contextmenu", e => e.preventDefault());
        document.addEventListener("gesturestart", e => e.preventDefault());
        document.addEventListener("dblclick", e => e.preventDefault());

        tryButton.addEventListener("click", () => {
          ensureAudio(); unlockSpeech();
          if (phase === "play") finalCheck(true);
        });
        caseButton.addEventListener("click", () => { ensureAudio(); unlockSpeech(); toggleCase(); boop(); });
        homeButton.addEventListener("click", () => { ensureAudio(); unlockSpeech(); showHome(true); boop(); });
        worldButtons.forEach(btn => btn.addEventListener("click", () => chooseWorld(btn.dataset.world)));
        clearButton.addEventListener("click", () => {
          ensureAudio(); unlockSpeech();
          if (phase !== "play") return;
          cancelTeachingAnimation();
          clearDrawing();
          boop();
        });
        newLetterButton.addEventListener("click", () => {
          ensureAudio(); unlockSpeech();
          if (phase === "home") return;
          nextTarget();
          boop();
        });
        installButton.addEventListener("click", installWebApp);
        soundButton.addEventListener("click", () => { unlockSpeech(); toggleSound(); });

        if ("ResizeObserver" in window) new ResizeObserver(() => resizeCanvases()).observe(canvasWrap);
        window.addEventListener("resize", resizeCanvases);
        window.addEventListener("orientationchange", () => setTimeout(resizeCanvases, 180));
      }

      function welcome() {
        loadProgress();
        updateSoundButton();
        updateCaseButton();
        applyWorld();
        setTarget(targetLetters[pos[world]] || "A");
        markLetter();
        // Picture-pack worlds show one of their own SVG pictures on the home screen.
        worldButtons.forEach(btn => {
          const W = WORLDS[btn.dataset.world], pic = btn.querySelector(".world-pic");
          const item = W && W.homePic ? W.items(W.homePic)[0] : null;
          if (pic && item && item.svg) pic.innerHTML = item.svg;
        });
        showHome(false);
      }

      setupAlphabet();
      setupWebAppInstall();
      initEvents();
      welcome();
      requestAnimationFrame(resizeCanvases);
    })();
  </script>
</body>
</html>
