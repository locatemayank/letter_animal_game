<![CDATA[<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#76d7ff" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Letter Zoo" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="description" content="A touchscreen letter writing and animal reveal game for young kids." />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icons/icon.svg" />
  <title>Magic Letter Zoo</title>
  <style>
    :root {
      --sky: #76d7ff;
      --sun: #ffd85a;
      --grass: #4bd269;
      --ink: #243b6b;
      --pink: #ff6fb1;
      --purple: #7c5cff;
      --card: rgba(255, 255, 255, 0.9);
      --shadow: 0 20px 50px rgba(36, 59, 107, 0.22);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      overflow-x: hidden;
      font-family: "Comic Sans MS", "Trebuchet MS", system-ui, -apple-system, sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at 12% 12%, #fff8b5 0 7rem, transparent 7.1rem),
        linear-gradient(#8be3ff 0%, #d8f8ff 56%, #baf6c3 56%, #64db77 100%);
      touch-action: manipulation;
    }

    body::before,
    body::after {
      content: "";
      position: fixed;
      z-index: -1;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.72);
      filter: blur(0.3px);
    }

    body::before {
      width: 14rem;
      height: 4.5rem;
      left: 12%;
      top: 12%;
      box-shadow: 12rem 5rem 0 -0.6rem rgba(255,255,255,0.6), 36rem 2rem 0 0.4rem rgba(255,255,255,0.55);
    }

    body::after {
      width: 10rem;
      height: 3.5rem;
      right: 8%;
      top: 22%;
      box-shadow: -18rem -8rem 0 0.2rem rgba(255,255,255,0.48);
    }

    .app {
      width: min(1480px, 100%);
      margin: 0 auto;
      padding: clamp(0.8rem, 1.6vw, 1.4rem);
    }

    header {
      text-align: center;
      margin-bottom: 0.7rem;
    }

    h1 {
      margin: 0;
      font-size: clamp(2.1rem, 7vw, 5.4rem);
      letter-spacing: 0.02em;
      color: #fff;
      text-shadow:
        0 5px 0 #2faee5,
        0 9px 0 #228cc3,
        0 14px 22px rgba(0, 0, 0, 0.18);
    }

    .subtitle {
      display: inline-flex;
      align-items: center;
      gap: 0.45rem;
      margin: 0.5rem 0 0;
      padding: 0.45rem 0.9rem;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.68);
      font-weight: 900;
      font-size: clamp(1rem, 2.5vw, 1.4rem);
      box-shadow: 0 9px 26px rgba(36, 59, 107, 0.12);
    }

    .game {
      display: grid;
      grid-template-columns: minmax(520px, 1.35fr) minmax(360px, 0.85fr);
      gap: clamp(0.8rem, 1.8vw, 1.4rem);
      align-items: stretch;
    }

    .panel {
      border: 7px solid rgba(255, 255, 255, 0.95);
      border-radius: 34px;
      background: var(--card);
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .draw-panel {
      display: flex;
      flex-direction: column;
      min-height: 560px;
    }

    .prompt {
      display: grid;
      grid-template-columns: auto 1fr auto;
      gap: 0.7rem;
      align-items: center;
      padding: 0.8rem 1rem;
      background: linear-gradient(90deg, #ffec7a, #ffd1ee);
      border-bottom: 6px solid rgba(255,255,255,0.72);
    }

    .star {
      display: grid;
      place-items: center;
      width: 3.7rem;
      height: 3.7rem;
      font-size: 2rem;
      border-radius: 50%;
      background: #fff;
      box-shadow: inset 0 -5px 0 rgba(0,0,0,0.08);
      animation: wiggle 1.8s ease-in-out infinite;
    }

    .prompt-text {
      min-width: 0;
    }

    .prompt-text strong {
      display: block;
      font-size: clamp(1.15rem, 3vw, 1.85rem);
      line-height: 1.05;
    }

    .prompt-text span {
      display: block;
      margin-top: 0.15rem;
      font-size: 1rem;
      font-weight: 800;
      opacity: 0.8;
    }

    .big-target {
      display: grid;
      place-items: center;
      width: clamp(4.2rem, 12vw, 6.4rem);
      height: clamp(4.2rem, 12vw, 6.4rem);
      border-radius: 28px;
      color: #fff;
      background: linear-gradient(135deg, var(--purple), var(--pink));
      font-size: clamp(2.8rem, 8vw, 4.9rem);
      font-weight: 1000;
      line-height: 1;
      text-shadow: 0 4px 0 rgba(0,0,0,0.16);
      box-shadow: 0 12px 0 #cf4b8c, 0 17px 28px rgba(0,0,0,0.18);
      transform: rotate(2deg);
    }

    .canvas-wrap {
      position: relative;
      flex: 1;
      min-height: 370px;
      background:
        linear-gradient(90deg, rgba(93, 121, 255, 0.12) 1px, transparent 1px) 0 0 / 42px 42px,
        linear-gradient(rgba(93, 121, 255, 0.12) 1px, transparent 1px) 0 0 / 42px 42px,
        #fffdf8;
      cursor: crosshair;
      touch-action: none;
    }

    #drawCanvas,
    #guideCanvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      touch-action: none;
    }

    #guideCanvas {
      opacity: 1;
      pointer-events: none;
    }

    .hint {
      position: absolute;
      left: 50%;
      top: 50%;
      width: min(88%, 520px);
      transform: translate(-50%, -50%);
      text-align: center;
      color: rgba(36, 59, 107, 0.38);
      font-size: clamp(1.2rem, 4vw, 2.2rem);
      font-weight: 1000;
      pointer-events: none;
      transition: opacity 0.18s ease;
    }

    .hint.hidden {
      opacity: 0;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 0.6rem;
      padding: 0.85rem;
      background: linear-gradient(90deg, #e4fbff, #fff1fa);
      border-top: 6px solid rgba(255,255,255,0.72);
    }

    button {
      border: 0;
      border-radius: 999px;
      padding: 1.05rem 1.35rem;
      min-height: 4.1rem;
      color: #fff;
      background: linear-gradient(180deg, #7c5cff, #5135dc);
      font-family: inherit;
      font-size: clamp(1.12rem, 1.8vw, 1.45rem);
      font-weight: 1000;
      box-shadow: 0 8px 0 #34249e, 0 12px 24px rgba(52, 36, 158, 0.22);
      cursor: pointer;
      transform: translateY(0);
      transition: transform 0.08s ease, box-shadow 0.08s ease, filter 0.14s ease;
    }

    button:active {
      transform: translateY(6px);
      box-shadow: 0 2px 0 #34249e, 0 4px 12px rgba(52, 36, 158, 0.18);
    }

    button.secondary {
      color: var(--ink);
      background: linear-gradient(180deg, #fff, #eafaff);
      box-shadow: 0 8px 0 #a6d9e8, 0 12px 20px rgba(20, 120, 160, 0.12);
    }

    button.secondary:active {
      box-shadow: 0 2px 0 #a6d9e8, 0 4px 12px rgba(20, 120, 160, 0.12);
    }

    button.sound {
      margin-left: auto;
      background: linear-gradient(180deg, #ff9f43, #ff6b35);
      box-shadow: 0 8px 0 #be4320, 0 12px 20px rgba(190, 67, 32, 0.18);
    }

    button.install {
      display: none;
      background: linear-gradient(180deg, #00cec9, #00a8a8);
      box-shadow: 0 8px 0 #007979, 0 12px 20px rgba(0, 121, 121, 0.18);
    }

    button.install.show {
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .zoo-panel {
      position: relative;
      display: flex;
      flex-direction: column;
      min-height: 560px;
      background:
        radial-gradient(circle at 18% 12%, rgba(255,255,255,0.85) 0 4rem, transparent 4.1rem),
        linear-gradient(160deg, #fffdf6, #f0f9ff 50%, #eafced);
    }

    .score-row {
      display: flex;
      justify-content: space-between;
      gap: 0.7rem;
      padding: 0.95rem 1rem 0;
    }

    .pill {
      flex: 1;
      padding: 0.55rem 0.65rem;
      border-radius: 999px;
      background: #fff;
      box-shadow: inset 0 -4px 0 rgba(0,0,0,0.06), 0 7px 18px rgba(36, 59, 107, 0.1);
      font-weight: 1000;
      text-align: center;
      white-space: nowrap;
    }

    .animal-stage {
      display: grid;
      place-items: center;
      flex: 1;
      padding: 1rem;
      text-align: center;
    }

    .animal-card {
      width: min(100%, 440px);
      min-height: 430px;
      padding: 1.1rem;
      border-radius: 34px;
      background: rgba(255, 255, 255, 0.88);
      box-shadow: inset 0 -8px 0 rgba(0,0,0,0.06), 0 18px 38px rgba(36, 59, 107, 0.14);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border: 4px dashed rgba(124, 92, 255, 0.25);
      transition: transform 0.18s ease;
    }

    .animal-card.pop {
      animation: pop 0.58s cubic-bezier(.18, 1.5, .45, 1);
    }

    .animal-emoji {
      font-size: clamp(6.5rem, 18vw, 12rem);
      line-height: 1;
      filter: drop-shadow(0 14px 0 rgba(36, 59, 107, 0.08));
      animation: floaty 2.4s ease-in-out infinite;
    }

    .recognized {
      margin-top: 0.5rem;
      font-size: clamp(1.6rem, 4.8vw, 3.3rem);
      font-weight: 1000;
      line-height: 1.05;
    }

    .animal-name {
      margin-top: 0.45rem;
      padding: 0.45rem 1rem;
      border-radius: 999px;
      color: #fff;
      background: linear-gradient(90deg, #00b894, #00cec9);
      font-size: clamp(1.6rem, 4.8vw, 3.1rem);
      font-weight: 1000;
      text-shadow: 0 3px 0 rgba(0,0,0,0.12);
    }

    .message {
      min-height: 4.2rem;
      margin-top: 0.8rem;
      font-size: clamp(1.05rem, 3vw, 1.55rem);
      font-weight: 1000;
      color: #4f3cc9;
    }

    .alphabet {
      display: flex;
      flex-wrap: wrap;
      gap: 0.35rem;
      justify-content: center;
      padding: 0 1rem 1rem;
    }

    .letter-chip {
      width: 2.35rem;
      height: 2.35rem;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: rgba(255,255,255,0.78);
      box-shadow: inset 0 -3px 0 rgba(0,0,0,0.07);
      font-weight: 1000;
      color: rgba(36, 59, 107, 0.65);
    }

    .letter-chip.found {
      color: #fff;
      background: linear-gradient(180deg, #ff6fb1, #f6388a);
      animation: chipBounce 0.45s ease;
    }

    .letter-chip.target {
      outline: 4px solid #ffd85a;
    }

    .confetti,
    .sparkle {
      position: fixed;
      z-index: 10;
      pointer-events: none;
    }

    .confetti {
      width: 0.75rem;
      height: 1.05rem;
      border-radius: 0.2rem;
      animation: confettiFall var(--dur) ease-in forwards;
      transform: rotate(var(--rot));
    }

    .sparkle {
      font-size: 1.6rem;
      animation: sparkle 0.9s ease-out forwards;
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 1.2rem;
      z-index: 20;
      transform: translateX(-50%);
      max-width: min(92%, 620px);
      padding: 0.75rem 1rem;
      border: 4px solid #fff;
      border-radius: 999px;
      color: #fff;
      background: linear-gradient(90deg, #7c5cff, #ff6fb1);
      font-size: clamp(1rem, 3vw, 1.35rem);
      font-weight: 1000;
      box-shadow: var(--shadow);
      opacity: 0;
      transition: opacity 0.18s ease, transform 0.18s ease;
    }

    .toast.show {
      opacity: 1;
      transform: translate(-50%, -0.25rem);
    }

    @keyframes wiggle {
      0%, 100% { transform: rotate(-8deg) scale(1); }
      50% { transform: rotate(8deg) scale(1.08); }
    }

    @keyframes pop {
      0% { transform: scale(0.72) rotate(-4deg); }
      60% { transform: scale(1.08) rotate(2deg); }
      100% { transform: scale(1) rotate(0); }
    }

    @keyframes floaty {
      0%, 100% { transform: translateY(0) rotate(-2deg); }
      50% { transform: translateY(-0.45rem) rotate(2deg); }
    }

    @keyframes chipBounce {
      0% { transform: scale(0.6); }
      60% { transform: scale(1.18); }
      100% { transform: scale(1); }
    }

    @keyframes confettiFall {
      0% {
        opacity: 1;
        transform: translate3d(0, -12vh, 0) rotate(0deg);
      }
      100% {
        opacity: 0;
        transform: translate3d(var(--drift), 108vh, 0) rotate(var(--spin));
      }
    }

    @keyframes sparkle {
      0% { opacity: 0; transform: scale(0.2) rotate(0); }
      25% { opacity: 1; }
      100% { opacity: 0; transform: translate(var(--dx), var(--dy)) scale(1.6) rotate(120deg); }
    }

    @media (min-width: 900px) and (orientation: landscape) {
      html,
      body {
        height: 100vh;
        min-height: 100vh;
        overflow: hidden;
      }

      .app {
        height: 100vh;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        padding: clamp(0.35rem, 0.8vw, 0.65rem);
      }

      header {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 0.8rem;
        margin-bottom: 0.35rem;
        min-height: 0;
      }

      h1 {
        font-size: clamp(1.65rem, 3.3vw, 3.1rem);
        line-height: 0.95;
        text-shadow:
          0 3px 0 #2faee5,
          0 5px 0 #228cc3,
          0 8px 14px rgba(0, 0, 0, 0.14);
      }

      .subtitle {
        margin: 0;
        padding: 0.25rem 0.65rem;
        font-size: clamp(0.85rem, 1.35vw, 1.05rem);
        line-height: 1;
      }

      .game {
        flex: 1;
        min-height: 0;
        grid-template-columns: minmax(560px, 1.48fr) minmax(330px, 0.72fr);
        gap: clamp(0.45rem, 1vw, 0.8rem);
      }

      .panel {
        border-width: 5px;
        border-radius: 24px;
      }

      .draw-panel,
      .zoo-panel {
        min-height: 0;
        height: 100%;
      }

      .prompt {
        grid-template-columns: auto minmax(0, 1fr) auto;
        gap: 0.45rem;
        padding: 0.35rem 0.6rem;
        border-bottom-width: 4px;
      }

      .star {
        width: 2.35rem;
        height: 2.35rem;
        font-size: 1.35rem;
      }

      .prompt-text strong {
        font-size: clamp(0.95rem, 1.7vw, 1.25rem);
        line-height: 1;
      }

      .prompt-text span {
        margin-top: 0.05rem;
        font-size: clamp(0.74rem, 1.1vw, 0.9rem);
        line-height: 1;
      }

      .big-target {
        width: clamp(3rem, 5.2vw, 4.1rem);
        height: clamp(3rem, 5.2vw, 4.1rem);
        border-radius: 18px;
        font-size: clamp(2rem, 4vw, 3.2rem);
        box-shadow: 0 7px 0 #cf4b8c, 0 10px 18px rgba(0,0,0,0.16);
      }

      .canvas-wrap {
        min-height: 0;
      }

      .controls {
        gap: 0.45rem;
        padding: 0.5rem;
        border-top-width: 4px;
      }

      .controls button {
        flex: 1 1 auto;
        min-height: 3rem;
        padding: 0.65rem 0.75rem;
        font-size: clamp(0.88rem, 1.25vw, 1.05rem);
        box-shadow: 0 6px 0 #34249e, 0 9px 16px rgba(52, 36, 158, 0.18);
      }

      .controls button.secondary {
        box-shadow: 0 6px 0 #a6d9e8, 0 9px 14px rgba(20, 120, 160, 0.1);
      }

      .controls button.sound {
        margin-left: 0;
        box-shadow: 0 6px 0 #be4320, 0 9px 14px rgba(190, 67, 32, 0.14);
      }

      .score-row {
        gap: 0.45rem;
        padding: 0.45rem 0.55rem 0;
      }

      .pill {
        padding: 0.35rem 0.45rem;
        font-size: clamp(0.82rem, 1.25vw, 0.98rem);
      }

      .animal-stage {
        min-height: 0;
        padding: 0.45rem;
      }

      .animal-card {
        width: min(100%, 380px);
        min-height: 0;
        height: 100%;
        padding: 0.65rem;
        border-radius: 24px;
      }

      .animal-emoji {
        font-size: clamp(4.4rem, 10vw, 7.8rem);
      }

      .recognized {
        margin-top: 0.25rem;
        font-size: clamp(1.15rem, 2.4vw, 2rem);
      }

      .animal-name {
        margin-top: 0.25rem;
        padding: 0.25rem 0.7rem;
        font-size: clamp(1.1rem, 2.35vw, 1.9rem);
      }

      .message {
        min-height: 2.4rem;
        margin-top: 0.45rem;
        font-size: clamp(0.82rem, 1.45vw, 1.05rem);
        line-height: 1.12;
      }

      .alphabet {
        gap: 0.25rem;
        padding: 0 0.55rem 0.55rem;
      }

      .letter-chip {
        width: 1.75rem;
        height: 1.75rem;
        font-size: 0.85rem;
      }
    }

    @media (max-width: 900px) {
      .game {
        grid-template-columns: 1fr;
      }

      .draw-panel,
      .zoo-panel {
        min-height: auto;
      }

      .canvas-wrap {
        min-height: 46vh;
      }

      .animal-card {
        min-height: 330px;
      }

      button.sound {
        margin-left: 0;
      }
    }

    @media (max-width: 480px) {
      .app {
        padding: 0.55rem;
      }

      .panel {
        border-width: 5px;
        border-radius: 26px;
      }

      .prompt {
        grid-template-columns: auto 1fr;
      }

      .big-target {
        grid-column: 1 / -1;
        justify-self: center;
      }

      .controls button {
        flex: 1 1 42%;
      }

      .score-row {
        flex-direction: column;
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <header>
      <h1>Magic Letter Zoo</h1>
      <div class="subtitle">✏️ Draw a letter. Meet an animal friend! 🐾</div>
    </header>

    <section class="game" aria-label="Magic Letter Zoo game">
      <div class="panel draw-panel">
        <div class="prompt">
          <div class="star" aria-hidden="true">⭐</div>
          <div class="prompt-text">
            <strong id="promptTitle">Can you write this letter?</strong>
            <span id="promptSubtitle">Use your finger, mouse, or stylus.</span>
          </div>
          <div class="big-target" id="targetLetter" aria-label="Target letter">A</div>
        </div>

        <div class="canvas-wrap" id="canvasWrap">
          <canvas id="guideCanvas" aria-hidden="true"></canvas>
          <canvas id="drawCanvas" aria-label="Drawing area"></canvas>
          <div class="hint" id="hint"></div>
        </div>

        <div class="controls">
          <button id="tryButton" type="button">✨ Guess My Letter</button>
          <button id="clearButton" class="secondary" type="button">🧽 Wipe</button>
          <button id="newLetterButton" class="secondary" type="button">🎲 New Letter</button>
          <button id="installButton" class="install" type="button">📲 Install App</button>
          <button id="soundButton" class="sound" type="button">🔊 Sound On</button>
        </div>
      </div>

      <div class="panel zoo-panel">
        <div class="score-row">
          <div class="pill">🏆 Stars: <span id="stars">0</span></div>
          <div class="pill">🦁 Zoo friends: <span id="foundCount">0</span></div>
        </div>

        <div class="animal-stage">
          <div class="animal-card" id="animalCard">
            <div class="animal-emoji" id="animalEmoji" aria-hidden="true">🦄</div>
            <div class="recognized" id="recognized">Ready?</div>
            <div class="animal-name" id="animalName">Magic Zoo</div>
            <div class="message" id="message">Pick up your finger when you finish. I will try to guess!</div>
          </div>
        </div>

        <div class="alphabet" id="alphabet" aria-label="Letters discovered"></div>
      </div>
    </section>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script>
    (() => {
      "use strict";

      const animals = {
        A: { name: "Alligator", emoji: "🐊", sound: "snap snap!" },
        B: { name: "Bear", emoji: "🐻", sound: "grrr!" },
        C: { name: "Cat", emoji: "🐱", sound: "meow!" },
        D: { name: "Dog", emoji: "🐶", sound: "woof!" },
        E: { name: "Elephant", emoji: "🐘", sound: "toot toot!" },
        F: { name: "Fox", emoji: "🦊", sound: "ring-ding!" },
        G: { name: "Giraffe", emoji: "🦒", sound: "munch munch!" },
        H: { name: "Hippo", emoji: "🦛", sound: "splash!" },
        I: { name: "Iguana", emoji: "🦎", sound: "scurry!" },
        J: { name: "Jaguar", emoji: "🐆", sound: "roar!" },
        K: { name: "Koala", emoji: "🐨", sound: "sleepy munch!" },
        L: { name: "Lion", emoji: "🦁", sound: "roar!" },
        M: { name: "Monkey", emoji: "🐵", sound: "ooh ooh!" },
        N: { name: "Narwhal", emoji: "🦄", sound: "splash sparkle!" },
        O: { name: "Owl", emoji: "🦉", sound: "hoot hoot!" },

        T: { name: "Tiger", emoji: "🐯", sound: "rawr!" },
        U: { name: "Unicorn", emoji: "🦄", sound: "sparkle!" },
        V: { name: "Vulture", emoji: "🦅", sound: "whoosh!" },
        W: { name: "Whale", emoji: "🐳", sound: "whoooo!" },
        X: { name: "X-ray Fish", emoji: "🐟", sound: "bubble bubble!" },
        Y: { name: "Yak", emoji: "🐂", sound: "moo!" },
        Z: { name: "Zebra", emoji: "🦓", sound: "neigh!" }
      };

      const targetLetters = Object.keys(animals);
      const canvasWrap = document.getElementById("canvasWrap");
      const drawCanvas = document.getElementById("drawCanvas");
      const guideCanvas = document.getElementById("guideCanvas");
      const dctx = drawCanvas.getContext("2d");
      const gctx = guideCanvas.getContext("2d");

      const hint = document.getElementById("hint");
      const targetLetterEl = document.getElementById("targetLetter");
      const promptTitle = document.getElementById("promptTitle");
      const promptSubtitle = document.getElementById("promptSubtitle");
      const animalCard = document.getElementById("animalCard");
      const animalEmoji = document.getElementById("animalEmoji");
      const recognized = document.getElementById("recognized");
      const animalName = document.getElementById("animalName");
      const message = document.getElementById("message");
      const starsEl = document.getElementById("stars");
      const foundCountEl = document.getElementById("foundCount");
      const alphabetEl = document.getElementById("alphabet");
      const toast = document.getElementById("toast");

      const tryButton = document.getElementById("tryButton");
      const clearButton = document.getElementById("clearButton");
      const newLetterButton = document.getElementById("newLetterButton");
      const installButton = document.getElementById("installButton");
      const soundButton = document.getElementById("soundButton");

      let width = 0;
      let height = 0;
      let drawing = false;
      let strokes = [];
      let currentStroke = [];
      let lastPoint = null;
      let activePointerId = null;
      let targetLetter = "A";
      let stars = 0;
      let audioEnabled = true;
      let audioCtx = null;
      let deferredInstallPrompt = null;
      let teachingAnimationId = null;
      let teachingAnimationToken = 0;
      let autoEraseTimer = null;
      const found = new Set();

      const alphabetChips = new Map();

      function makePoint(x, y) {
        return { x, y };
      }

      function dist(a, b) {
        return Math.hypot(a.x - b.x, a.y - b.y);
      }

      function pathLength(points) {
        let len = 0;
        for (let i = 1; i < points.length; i++) len += dist(points[i - 1], points[i]);
        return len;
      }

      function lerp(a, b, t) {
        return a + (b - a) * t;
      }

      function flattenStrokes(sourceStrokes) {
        const flat = [];
        sourceStrokes.forEach((stroke, strokeIndex) => {
          stroke.forEach((p, pointIndex) => {
            flat.push({ x: p.x, y: p.y, stroke: strokeIndex, start: pointIndex === 0 });
          });
        });
        return flat;
      }

      function normalize(points, size = 100) {
        if (points.length === 0) return [];
        let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
        points.forEach(p => {
          minX = Math.min(minX, p.x);
          minY = Math.min(minY, p.y);
          maxX = Math.max(maxX, p.x);
          maxY = Math.max(maxY, p.y);
        });

        const boxW = Math.max(1, maxX - minX);
        const boxH = Math.max(1, maxY - minY);
        const scale = size / Math.max(boxW, boxH);
        const normalized = points.map(p => ({
          x: (p.x - minX) * scale,
          y: (p.y - minY) * scale,
          stroke: p.stroke,
          start: p.start
        }));

        const center = normalized.reduce((acc, p) => {
          acc.x += p.x;
          acc.y += p.y;
          return acc;
        }, { x: 0, y: 0 });
        center.x /= normalized.length;
        center.y /= normalized.length;

        return normalized.map(p => ({
          x: p.x - center.x,
          y: p.y - center.y,
          stroke: p.stroke,
          start: p.start
        }));
      }

      function resample(points, n = 64) {
        if (points.length === 0) return [];
        if (points.length === 1) return Array.from({ length: n }, () => ({ ...points[0] }));

        const output = [{ ...points[0] }];
        let segmentRemainder = 0;
        const total = pathLength(points);
        const interval = total / (n - 1);

        if (!isFinite(interval) || interval <= 0.01) {
          return Array.from({ length: n }, (_, i) => ({ ...points[Math.min(points.length - 1, i)] }));
        }

        let prev = { ...points[0] };
        for (let i = 1; i < points.length; i++) {
          let curr = { ...points[i] };
          let d = dist(prev, curr);

          while ((segmentRemainder + d) >= interval && output.length < n) {
            const t = (interval - segmentRemainder) / d;
            const nx = lerp(prev.x, curr.x, t);
            const ny = lerp(prev.y, curr.y, t);
            const newPoint = { x: nx, y: ny, stroke: curr.stroke, start: false };
            output.push(newPoint);
            prev = newPoint;
            d = dist(prev, curr);
            segmentRemainder = 0;
          }
          segmentRemainder += d;
          prev = curr;
        }

        while (output.length < n) output.push({ ...points[points.length - 1] });
        return output.slice(0, n);
      }

      function vectorDistance(a, b) {
        let sum = 0;
        const n = Math.min(a.length, b.length);
        for (let i = 0; i < n; i++) {
          const dx = a[i].x - b[i].x;
          const dy = a[i].y - b[i].y;
          sum += Math.hypot(dx, dy);
        }
        return sum / Math.max(1, n);
      }

      function angleBetween(a, b) {
        return Math.atan2(b.y - a.y, b.x - a.x);
      }

      function basicFeatures(rawPoints, sourceStrokes) {
        if (rawPoints.length === 0) {
          return {
            strokeCount: 0, aspect: 1, closedness: 9, turnCount: 0,
            endpoints: [], minX: 0, maxX: 0, minY: 0, maxY: 0
          };
        }

        let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
        rawPoints.forEach(p => {
          minX = Math.min(minX, p.x);
          minY = Math.min(minY, p.y);
          maxX = Math.max(maxX, p.x);
          maxY = Math.max(maxY, p.y);
        });

        const w = Math.max(1, maxX - minX);
        const h = Math.max(1, maxY - minY);
        const diagonal = Math.max(1, Math.hypot(w, h));
        const start = rawPoints[0];
        const end = rawPoints[rawPoints.length - 1];
        const closedness = dist(start, end) / diagonal;

        let turnCount = 0;
        const pts = resample(rawPoints, 28);
        for (let i = 2; i < pts.length; i++) {
          const a1 = angleBetween(pts[i - 2], pts[i - 1]);
          const a2 = angleBetween(pts[i - 1], pts[i]);
          let delta = Math.abs(a2 - a1);
          delta = Math.min(delta, Math.PI * 2 - delta);
          if (delta > 1.08) turnCount++;
        }

        const endpoints = [];
        sourceStrokes.forEach(stroke => {
          if (stroke.length) {
            endpoints.push(stroke[0], stroke[stroke.length - 1]);
          }
        });

        const xNorm = p => (p.x - minX) / w;
        const yNorm = p => (p.y - minY) / h;
        const first = rawPoints[0];
        const last = rawPoints[rawPoints.length - 1];
        const startXNorm = xNorm(first);
        const startYNorm = yNorm(first);
        const endXNorm = xNorm(last);
        const endYNorm = yNorm(last);
        const lowerHalfPoints = rawPoints.filter(p => yNorm(p) > 0.52);
        const lowerRightRatio = lowerHalfPoints.length
          ? lowerHalfPoints.filter(p => xNorm(p) > 0.45).length / lowerHalfPoints.length
          : 0;
        const endpointsRight = startXNorm > 0.52 && endXNorm > 0.58;
        const endInside = endXNorm < 0.72 && endYNorm > 0.35 && endYNorm < 0.9;

        return {
          strokeCount: sourceStrokes.length,
          aspect: w / h,
          closedness,
          turnCount,
          endpoints,
          minX, maxX, minY, maxY,
          startXNorm,
          startYNorm,
          endXNorm,
          endYNorm,
          lowerRightRatio,
          endpointsRight,
          endInside
        };
      }

      function makeStroke(points) {
        return points.map(([x, y]) => ({ x, y }));
      }

      const templateDefinitions = {
        A: [[[10,100],[30,10],[50,100]], [[22,62],[42,62]]],
        B: [[[10,100],[10,10],[45,12],[58,25],[46,43],[10,47],[48,49],[62,68],[48,94],[10,100]]],
        C: [[[70,15],[35,5],[12,28],[10,72],[35,97],[72,84]]],
        D: [[[12,100],[12,10],[48,12],[72,35],[72,72],[48,96],[12,100]]],
        E: [[[70,10],[12,10],[12,52],[55,52],[12,52],[12,96],[72,96]]],
        F: [[[12,98],[12,10],[72,10],[12,10],[12,52],[55,52]]],
        G: [[[74,18],[42,7],[15,26],[10,62],[28,90],[62,92],[78,70],[52,70]]],
        H: [[[12,10],[12,98]], [[70,10],[70,98]], [[12,54],[70,54]]],
        I: [[[24,10],[76,10]], [[50,10],[50,96]], [[24,96],[76,96]]],
        J: [[[72,10],[72,72],[58,94],[34,96],[18,80]]],
        K: [[[14,10],[14,98]], [[70,10],[14,56],[72,98]]],
        L: [[[16,10],[16,96],[74,96]]],
        M: [[[10,98],[10,12],[42,65],[72,12],[72,98]]],
        N: [[[12,98],[12,12],[72,98],[72,12]]],
        O: [[[50,8],[22,18],[10,50],[22,84],[50,98],[78,84],[90,50],[78,18],[50,8]]],
        P: [[[12,98],[12,10],[52,12],[70,28],[58,50],[12,52]]],
        Q: [[[50,8],[22,18],[10,50],[22,84],[50,98],[78,84],[90,50],[78,18],[50,8]], [[60,72],[88,100]]],
        R: [[[12,98],[12,10],[52,12],[70,28],[58,50],[12,52],[46,52],[74,98]]],
        S: [[[74,18],[45,8],[16,20],[18,44],[56,54],[78,70],[62,92],[24,88]]],
        T: [[[15,10],[85,10]], [[50,10],[50,98]]],
        U: [[[12,10],[12,70],[28,94],[52,98],[74,72],[74,10]]],
        V: [[[10,10],[42,98],[78,10]]],
        W: [[[8,10],[24,98],[45,42],[66,98],[84,10]]],
        X: [[[12,12],[78,98]], [[78,12],[12,98]]],
        Y: [[[10,12],[45,52],[80,12]], [[45,52],[45,98]]],
        Z: [[[12,12],[78,12],[15,98],[82,98]]]
      };

      const templates = Object.entries(templateDefinitions).map(([letter, strokes]) => {
        const flat = flattenStrokes(strokes.map(makeStroke));
        return {
          letter,
          strokes,
          vector: resample(normalize(flat), 64),
          feature: basicFeatures(flat, strokes.map(makeStroke))
        };
      });

      function recognizeLetter(sourceStrokes) {
        const raw = flattenStrokes(sourceStrokes);
        if (raw.length < 7) return null;

        const userVector = resample(normalize(raw), 64);
        const userFeature = basicFeatures(raw, sourceStrokes);

        let best = { letter: "A", score: Infinity };
        const ranked = templates.map(template => {
          const shape = vectorDistance(userVector, template.vector);
          const strokePenalty = Math.min(14, Math.abs(userFeature.strokeCount - template.feature.strokeCount) * 2.3);
          const aspectPenalty = Math.min(16, Math.abs(Math.log(userFeature.aspect / template.feature.aspect)) * 7);
          const closedPenalty = Math.min(12, Math.abs(userFeature.closedness - template.feature.closedness) * 6);
          let score = shape + strokePenalty + aspectPenalty + closedPenalty;

          // Friendly nudges for common child-written shapes.
          if (userFeature.closedness < 0.22 && ["O", "Q"].includes(template.letter)) score -= 9;
          if (userFeature.aspect > 1.85 && ["L", "T", "Z", "E", "F"].includes(template.letter)) score -= 2;
          if (userFeature.aspect < 0.48 && ["I", "J", "L"].includes(template.letter)) score -= 4;
          if (userFeature.turnCount > 9 && ["S", "G", "B"].includes(template.letter)) score -= 3;

          // Extra toddler-writing disambiguation:
          // C vs G: a C usually starts and ends on the right side; a G usually finishes inward.
          if (userFeature.endpointsRight && userFeature.endXNorm > 0.68 && userFeature.closedness > 0.24) {
            if (template.letter === "C") score -= 10;
            if (template.letter === "G") score += 13;
          }
          if (userFeature.endInside) {
            if (template.letter === "G") score -= 5;
            if (template.letter === "C") score += 5;
          }

          // B vs P: a B has meaningful drawing on the lower-right; a P mostly does not.
          if (userFeature.lowerRightRatio > 0.2) {
            if (template.letter === "B") score -= 10;
            if (template.letter === "P") score += 14;
          } else if (userFeature.lowerRightRatio < 0.1) {
            if (template.letter === "P") score -= 5;
            if (template.letter === "B") score += 9;
          }

          return { letter: template.letter, score };
        }).sort((a, b) => a.score - b.score);

        best = ranked[0];

        // If the target letter is very close, prefer it. Keep the margin small to avoid
        // turning look-alike letters such as C/G or B/P into the target by accident.
        const targetRank = ranked.find(r => r.letter === targetLetter);
        if (targetRank && targetRank.score < best.score + 4) {
          best = { ...targetRank, encouraged: true };
        }

        return {
          letter: best.letter,
          score: best.score,
          confidence: Math.max(0, Math.min(1, 1 - best.score / 58)),
          alternatives: ranked.slice(0, 4)
        };
      }

      function setupAlphabet() {
        alphabetEl.innerHTML = "";
        alphabetChips.clear();
        targetLetters.forEach(letter => {
          const chip = document.createElement("div");
          chip.className = "letter-chip";
          chip.textContent = letter;
          chip.setAttribute("aria-label", `${letter} not discovered yet`);
          alphabetEl.appendChild(chip);
          alphabetChips.set(letter, chip);
        });
      }

      function resizeCanvases() {
        const rect = canvasWrap.getBoundingClientRect();
        const ratio = window.devicePixelRatio || 1;
        width = Math.max(1, rect.width);
        height = Math.max(1, rect.height);

        [drawCanvas, guideCanvas].forEach(canvas => {
          canvas.width = Math.floor(width * ratio);
          canvas.height = Math.floor(height * ratio);
          canvas.style.width = `${width}px`;
          canvas.style.height = `${height}px`;
          const ctx = canvas.getContext("2d");
          ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
        });

        redraw();
        drawGuideLetter();
      }

      function clearAutoEraseTimer() {
        window.clearTimeout(autoEraseTimer);
        autoEraseTimer = null;
      }

      function scheduleAutoErase(delay = 8500, text = "All clean! Try another letter!") {
        clearAutoEraseTimer();
        autoEraseTimer = window.setTimeout(() => {
          if (drawing || strokes.length === 0) return;
          clearDrawing(true);
          message.textContent = text;
          showToast("I wiped the board for you!");
          boop(true);
        }, delay);
      }

      function clearDrawing(keepMessage = false) {
        clearAutoEraseTimer();
        strokes = [];
        currentStroke = [];
        lastPoint = null;
        dctx.clearRect(0, 0, width, height);
        hint.classList.remove("hidden");
        if (!keepMessage) {
          message.textContent = "Draw a big letter, then I will guess!";
        }
        drawGuideLetter();
      }

      function redraw() {
        dctx.clearRect(0, 0, width, height);
        dctx.lineCap = "round";
        dctx.lineJoin = "round";

        strokes.forEach(stroke => {
          drawStroke(stroke);
        });

        if (currentStroke.length) drawStroke(currentStroke);
      }

      function drawStroke(stroke) {
        if (stroke.length < 2) return;
        dctx.save();
        dctx.lineWidth = Math.max(13, Math.min(26, width / 32));
        dctx.strokeStyle = "#4f7cff";
        dctx.shadowColor = "rgba(79, 124, 255, 0.28)";
        dctx.shadowBlur = 8;
        dctx.beginPath();
        dctx.moveTo(stroke[0].x, stroke[0].y);
        for (let i = 1; i < stroke.length; i++) {
          const midX = (stroke[i - 1].x + stroke[i].x) / 2;
          const midY = (stroke[i - 1].y + stroke[i].y) / 2;
          dctx.quadraticCurveTo(stroke[i - 1].x, stroke[i - 1].y, midX, midY);
        }
        const last = stroke[stroke.length - 1];
        dctx.lineTo(last.x, last.y);
        dctx.stroke();

        dctx.lineWidth = Math.max(5, Math.min(10, width / 74));
        dctx.strokeStyle = "rgba(255,255,255,0.75)";
        dctx.shadowBlur = 0;
        dctx.stroke();
        dctx.restore();
      }

      function cancelTeachingAnimation() {
        teachingAnimationToken += 1;
        if (teachingAnimationId) {
          cancelAnimationFrame(teachingAnimationId);
          teachingAnimationId = null;
        }
      }

      function drawGuideLetter() {
        cancelTeachingAnimation();
        drawFaintGuideLetter(targetLetter);
      }

      function drawFaintGuideLetter(letter) {
        gctx.clearRect(0, 0, width, height);
        const guideStrokes = templateToCanvasStrokes(letter);
        const lineWidth = Math.max(12, Math.min(26, width / 34));

        gctx.save();
        gctx.lineCap = "round";
        gctx.lineJoin = "round";
        gctx.lineWidth = lineWidth;
        gctx.strokeStyle = "rgba(124, 92, 255, 0.42)";
        gctx.shadowColor = "rgba(124, 92, 255, 0.16)";
        gctx.shadowBlur = 8;

        guideStrokes.forEach(stroke => {
          if (stroke.length < 2) return;
          gctx.beginPath();
          gctx.moveTo(stroke[0].x, stroke[0].y);
          for (let i = 1; i < stroke.length; i++) {
            gctx.lineTo(stroke[i].x, stroke[i].y);
          }
          gctx.stroke();
        });

        gctx.restore();
      }

      function templateToCanvasStrokes(letter) {
        const rawStrokes = templateDefinitions[letter] || templateDefinitions.A;
        const flat = rawStrokes.flat();
        let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
        flat.forEach(([x, y]) => {
          minX = Math.min(minX, x);
          minY = Math.min(minY, y);
          maxX = Math.max(maxX, x);
          maxY = Math.max(maxY, y);
        });

        const padding = Math.max(28, Math.min(width, height) * 0.16);
        const rawW = Math.max(1, maxX - minX);
        const rawH = Math.max(1, maxY - minY);
        const scale = Math.min((width - padding * 2) / rawW, (height - padding * 2) / rawH);
        const offsetX = (width - rawW * scale) / 2 - minX * scale;
        const offsetY = (height - rawH * scale) / 2 - minY * scale + height * 0.04;

        return rawStrokes.map(stroke =>
          stroke.map(([x, y]) => ({
            x: x * scale + offsetX,
            y: y * scale + offsetY
          }))
        );
      }

      function drawTeachingStroke(points, progress, color, lineWidth) {
        if (points.length < 2 || progress <= 0) return;

        const total = pathLength(points);
        const target = total * Math.min(1, progress);
        let travelled = 0;

        gctx.save();
        gctx.lineCap = "round";
        gctx.lineJoin = "round";
        gctx.lineWidth = lineWidth;
        gctx.strokeStyle = color;
        gctx.shadowColor = "rgba(0, 184, 148, 0.26)";
        gctx.shadowBlur = 10;
        gctx.beginPath();
        gctx.moveTo(points[0].x, points[0].y);

        for (let i = 1; i < points.length; i++) {
          const segment = dist(points[i - 1], points[i]);
          if (travelled + segment <= target) {
            gctx.lineTo(points[i].x, points[i].y);
            travelled += segment;
          } else {
            const t = Math.max(0, Math.min(1, (target - travelled) / segment));
            gctx.lineTo(lerp(points[i - 1].x, points[i].x, t), lerp(points[i - 1].y, points[i].y, t));
            break;
          }
        }

        gctx.stroke();
        gctx.lineWidth = Math.max(4, lineWidth * 0.36);
        gctx.strokeStyle = "rgba(255,255,255,0.78)";
        gctx.shadowBlur = 0;
        gctx.stroke();
        gctx.restore();
      }

      function drawStartDot(point, number) {
        gctx.save();
        gctx.fillStyle = "#ffd85a";
        gctx.strokeStyle = "#ff9f43";
        gctx.lineWidth = 4;
        gctx.beginPath();
        gctx.arc(point.x, point.y, Math.max(15, Math.min(width, height) / 34), 0, Math.PI * 2);
        gctx.fill();
        gctx.stroke();
        gctx.fillStyle = "#243b6b";
        gctx.font = `900 ${Math.max(16, Math.min(width, height) / 22)}px "Comic Sans MS", system-ui, sans-serif`;
        gctx.textAlign = "center";
        gctx.textBaseline = "middle";
        gctx.fillText(String(number), point.x, point.y + 1);
        gctx.restore();
      }

      function drawMovingStar(stroke, progress) {
        if (stroke.length < 2 || progress <= 0) return;
        const sampled = resample(stroke, 80);
        const index = Math.min(sampled.length - 1, Math.floor(progress * (sampled.length - 1)));
        const p = sampled[index];
        gctx.save();
        gctx.font = `${Math.max(24, Math.min(width, height) / 13)}px "Comic Sans MS", system-ui, sans-serif`;
        gctx.textAlign = "center";
        gctx.textBaseline = "middle";
        gctx.fillText("⭐", p.x, p.y);
        gctx.restore();
      }

      function animateCorrectLetter(letter) {
        cancelTeachingAnimation();
        const token = teachingAnimationToken;
        const teachingStrokes = templateToCanvasStrokes(letter);
        const duration = Math.max(2300, teachingStrokes.length * 850 + 700);
        const lineWidth = Math.max(16, Math.min(34, width / 26));
        const start = performance.now();

        function frame(now) {
          if (token !== teachingAnimationToken) return;

          const elapsed = now - start;
          const progress = Math.min(1, elapsed / duration);
          const active = progress * teachingStrokes.length;

          drawFaintGuideLetter(letter);

          gctx.save();
          gctx.fillStyle = "#4f3cc9";
          gctx.font = `900 ${Math.max(22, Math.min(width, height) / 18)}px "Comic Sans MS", system-ui, sans-serif`;
          gctx.textAlign = "center";
          gctx.textBaseline = "top";
          gctx.fillText(`This is how we write ${letter}!`, width / 2, 16);
          gctx.restore();

          teachingStrokes.forEach((stroke, index) => {
            drawStartDot(stroke[0], index + 1);
            const strokeProgress = Math.max(0, Math.min(1, active - index));
            drawTeachingStroke(stroke, strokeProgress, index % 2 ? "#ff6fb1" : "#00b894", lineWidth);
            if (strokeProgress > 0 && strokeProgress < 1) {
              drawMovingStar(stroke, strokeProgress);
            }
          });

          if (progress < 1) {
            teachingAnimationId = requestAnimationFrame(frame);
          } else {
            teachingAnimationId = null;
          }
        }

        teachingAnimationId = requestAnimationFrame(frame);
      }

      function pointerPosition(event) {
        const rect = drawCanvas.getBoundingClientRect();
        return makePoint(event.clientX - rect.left, event.clientY - rect.top);
      }

      function startDraw(event) {
        event.preventDefault();

        // Ignore multi-touch. Only the first finger/stylus draws; extra fingers are ignored.
        if (activePointerId !== null || (event.pointerType === "touch" && event.isPrimary === false)) {
          return;
        }

        window.clearTimeout(endDraw.timer);
        clearAutoEraseTimer();
        drawGuideLetter();
        activePointerId = event.pointerId;
        if (event.pointerType === "touch") {
          drawCanvas.setPointerCapture(event.pointerId);
        }
        drawing = true;
        hint.classList.add("hidden");
        currentStroke = [pointerPosition(event)];
        lastPoint = currentStroke[0];
        playTinyTap();
      }

      function moveDraw(event) {
        if (!drawing || event.pointerId !== activePointerId) return;
        event.preventDefault();
        const p = pointerPosition(event);
        if (!lastPoint || dist(lastPoint, p) > 2.2) {
          currentStroke.push(p);
          lastPoint = p;
          redraw();
        }
      }

      function endDraw(event) {
        if (!drawing || event.pointerId !== activePointerId) return;
        event.preventDefault();
        drawing = false;
        activePointerId = null;
        if (currentStroke.length > 1) {
          strokes.push(simplifyStroke(currentStroke));
          sparkleAt(currentStroke[currentStroke.length - 1]);
        }
        currentStroke = [];
        lastPoint = null;
        redraw();

        if (flattenStrokes(strokes).length > 10) {
          window.clearTimeout(endDraw.timer);
          endDraw.timer = window.setTimeout(() => guessLetter(false), 2200);
        } else {
          scheduleAutoErase(9000, "The board is clean. Draw a big letter!");
        }
      }

      function simplifyStroke(stroke) {
        const simplified = [];
        stroke.forEach(p => {
          if (!simplified.length || dist(simplified[simplified.length - 1], p) > 3) {
            simplified.push(p);
          }
        });
        return simplified;
      }

      function guessLetter(manual) {
        const result = recognizeLetter(strokes);
        if (!result) {
          showToast("Try drawing a little bigger!");
          message.textContent = "I need a little more drawing to guess.";
          boop(false);
          scheduleAutoErase(7000, "I wiped the board. Try a big letter!");
          return;
        }

        revealAnimal(result.letter, result.confidence, manual);
      }

      function revealAnimal(letter, confidence = 0.7, manual = false) {
        const animal = animals[letter] || animals.A;
        const isTarget = letter === targetLetter;
        const alreadyFound = found.has(letter);

        animalEmoji.textContent = animal.emoji;
        recognized.textContent = `I see ${letter}!`;
        animalName.textContent = `${letter} is for ${animal.name}!`;

        const praise = [
          "Amazing!",
          "Wow!",
          "Super writing!",
          "Zoo-rific!",
          "You did it!",
          "Fantastic!"
        ][Math.floor(Math.random() * 6)];

        if (isTarget) {
          message.textContent = `${praise} You found the letter ${letter}! Watch how to write ${letter}! ${animal.name} says "${animal.sound}"`;
          stars += alreadyFound ? 1 : 3;
          setTimeout(nextTarget, 4200);
        } else if (confidence < 0.34) {
          message.textContent = `Hmm... I think it might be ${letter}. ${animal.name} came to say hi!`;
          stars += alreadyFound ? 0 : 1;
        } else {
          message.textContent = `${praise} I guessed ${letter}. Now watch the right way to write ${letter}! ${animal.name} says "${animal.sound}"`;
          stars += alreadyFound ? 1 : 2;
        }

        animateCorrectLetter(letter);
        found.add(letter);
        updateScore();
        markLetter(letter);
        animalCard.classList.remove("pop");
        void animalCard.offsetWidth;
        animalCard.classList.add("pop");

        burstConfetti(isTarget ? 70 : 42);
        cheer(letter, isTarget);
        speakAnimal(letter, animal);
        showToast(isTarget ? `You matched ${letter}! ⭐⭐⭐` : `${letter} is for ${animal.name}!`);

        if (!manual && isTarget) {
          promptSubtitle.textContent = "Great match! A new letter is coming...";
        }

        if (!isTarget) {
          scheduleAutoErase(5400, "I cleaned the board. Draw another letter!");
        }
      }

      function updateScore() {
        starsEl.textContent = stars;
        foundCountEl.textContent = found.size;
      }

      function markLetter(letter) {
        alphabetChips.forEach((chip, chipLetter) => {
          chip.classList.toggle("found", found.has(chipLetter));
          chip.classList.toggle("target", chipLetter === targetLetter);
          chip.setAttribute(
            "aria-label",
            `${chipLetter}${found.has(chipLetter) ? " discovered" : " not discovered yet"}${chipLetter === targetLetter ? ", current target" : ""}`
          );
        });
      }

      function nextTarget() {
        const notFound = targetLetters.filter(letter => !found.has(letter));
        const pool = notFound.length ? notFound : targetLetters;
        targetLetter = pool[Math.floor(Math.random() * pool.length)];
        targetLetterEl.textContent = targetLetter;
        promptTitle.textContent = `Can you write ${targetLetter}?`;
        promptSubtitle.textContent = `${targetLetter} brings a zoo surprise!`;
        markLetter(targetLetter);
        clearDrawing(true);
        drawGuideLetter();
      }

      function showToast(text) {
        toast.textContent = text;
        toast.classList.add("show");
        window.clearTimeout(showToast.timer);
        showToast.timer = window.setTimeout(() => toast.classList.remove("show"), 1500);
      }

      function burstConfetti(count) {
        const colors = ["#ff6fb1", "#ffd85a", "#4bd269", "#7c5cff", "#00cec9", "#ff9f43"];
        for (let i = 0; i < count; i++) {
          const piece = document.createElement("div");
          piece.className = "confetti";
          piece.style.left = `${Math.random() * 100}vw`;
          piece.style.top = `${-8 - Math.random() * 20}vh`;
          piece.style.background = colors[i % colors.length];
          piece.style.setProperty("--dur", `${1.6 + Math.random() * 1.6}s`);
          piece.style.setProperty("--drift", `${-80 + Math.random() * 160}px`);
          piece.style.setProperty("--spin", `${360 + Math.random() * 720}deg`);
          piece.style.setProperty("--rot", `${Math.random() * 180}deg`);
          document.body.appendChild(piece);
          piece.addEventListener("animationend", () => piece.remove(), { once: true });
        }
      }

      function sparkleAt(point) {
        if (!point) return;
        const icons = ["✨", "⭐", "💫", "🌟"];
        for (let i = 0; i < 5; i++) {
          const sp = document.createElement("div");
          sp.className = "sparkle";
          sp.textContent = icons[Math.floor(Math.random() * icons.length)];
          const rect = drawCanvas.getBoundingClientRect();
          sp.style.left = `${rect.left + point.x}px`;
          sp.style.top = `${rect.top + point.y}px`;
          sp.style.setProperty("--dx", `${-45 + Math.random() * 90}px`);
          sp.style.setProperty("--dy", `${-55 + Math.random() * 60}px`);
          document.body.appendChild(sp);
          sp.addEventListener("animationend", () => sp.remove(), { once: true });
        }
      }

      function ensureAudio() {
        if (!audioEnabled) return null;
        if (!audioCtx) {
          const Context = window.AudioContext || window.webkitAudioContext;
          if (!Context) return null;
          audioCtx = new Context();
        }
        if (audioCtx.state === "suspended") audioCtx.resume();
        return audioCtx;
      }

      function tone(freq, duration, type = "sine", delay = 0, gainValue = 0.06) {
        const ctx = ensureAudio();
        if (!ctx) return;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, ctx.currentTime + delay);
        gain.gain.setValueAtTime(0.0001, ctx.currentTime + delay);
        gain.gain.exponentialRampToValueAtTime(gainValue, ctx.currentTime + delay + 0.018);
        gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + delay + duration);
        osc.connect(gain).connect(ctx.destination);
        osc.start(ctx.currentTime + delay);
        osc.stop(ctx.currentTime + delay + duration + 0.02);
      }

      function cheer(letter, big) {
        if (!audioEnabled) return;
        const base = 240 + (letter.charCodeAt(0) - 65) * 9;
        tone(base, 0.14, "triangle", 0, 0.055);
        tone(base * 1.25, 0.14, "triangle", 0.13, 0.065);
        tone(base * 1.5, 0.18, "triangle", 0.26, 0.075);
        if (big) {
          tone(base * 2, 0.22, "sine", 0.43, 0.055);
        }
      }

      function boop(happy) {
        if (!audioEnabled) return;
        tone(happy ? 540 : 190, 0.15, happy ? "triangle" : "sawtooth", 0, 0.04);
      }

      function playTinyTap() {
        if (!audioEnabled) return;
        tone(640, 0.035, "sine", 0, 0.015);
      }

      function speakAnimal(letter, animal) {
        if (!audioEnabled || !("speechSynthesis" in window)) return;

        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(`${letter} is for ${animal.name}`);
        utterance.rate = 0.82;
        utterance.pitch = 1.22;
        utterance.volume = 1;
        window.speechSynthesis.speak(utterance);
      }

      function toggleSound() {
        audioEnabled = !audioEnabled;
        soundButton.textContent = audioEnabled ? "🔊 Sound On" : "🔇 Sound Off";
        if (audioEnabled) {
          ensureAudio();
          boop(true);
          showToast("Sound on!");
        } else {
          if ("speechSynthesis" in window) window.speechSynthesis.cancel();
          showToast("Sound off");
        }
      }

      async function installWebApp() {
        if (!deferredInstallPrompt) {
          showToast("Use your browser menu to add this game to the home screen.");
          return;
        }

        deferredInstallPrompt.prompt();
        await deferredInstallPrompt.userChoice;
        deferredInstallPrompt = null;
        installButton.classList.remove("show");
      }

      function setupWebAppInstall() {
        if ("serviceWorker" in navigator) {
          window.addEventListener("load", () => {
            navigator.serviceWorker.register("./sw.js").catch(() => {
              // The game still works without service worker support.
            });
          });
        }

        window.addEventListener("beforeinstallprompt", event => {
          event.preventDefault();
          deferredInstallPrompt = event;
          installButton.classList.add("show");
          showToast("You can install Magic Letter Zoo!");
        });

        window.addEventListener("appinstalled", () => {
          deferredInstallPrompt = null;
          installButton.classList.remove("show");
          showToast("Magic Letter Zoo installed!");
        });
      }

      function initEvents() {
        drawCanvas.addEventListener("pointerdown", startDraw);
        drawCanvas.addEventListener("pointermove", moveDraw);
        drawCanvas.addEventListener("pointerup", endDraw);
        drawCanvas.addEventListener("pointercancel", endDraw);
        drawCanvas.addEventListener("lostpointercapture", event => {
          if (drawing && event.pointerId === activePointerId) {
            drawing = false;
            activePointerId = null;
            currentStroke = [];
            lastPoint = null;
          }
        });

        tryButton.addEventListener("click", () => {
          ensureAudio();
          guessLetter(true);
        });

        clearButton.addEventListener("click", () => {
          ensureAudio();
          clearDrawing();
          boop(true);
        });

        newLetterButton.addEventListener("click", () => {
          ensureAudio();
          nextTarget();
          boop(true);
          showToast(`Try ${targetLetter}!`);
        });

        installButton.addEventListener("click", installWebApp);
        soundButton.addEventListener("click", toggleSound);
        window.addEventListener("resize", resizeCanvases);
        window.addEventListener("orientationchange", () => setTimeout(resizeCanvases, 180));
      }

      function welcome() {
        targetLetter = "A";
        targetLetterEl.textContent = targetLetter;
        promptTitle.textContent = `Can you write ${targetLetter}?`;
        promptSubtitle.textContent = "Trace the big guide or draw your own!";
        animalEmoji.textContent = "🦁";
        recognized.textContent = "Hello, little writer!";
        animalName.textContent = "Welcome to the Zoo";
        message.textContent = "Draw a letter. I will guess and bring an animal friend!";
        updateScore();
        markLetter(targetLetter);
      }

      setupAlphabet();
      setupWebAppInstall();
      initEvents();
      welcome();

      // Let layout settle before sizing canvases.
      requestAnimationFrame(resizeCanvases);
    })();
  </script>
</body>
</html>
